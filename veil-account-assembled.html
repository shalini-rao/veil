<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-page: #F5EDE2; --surface-card: #FFFBF5;
    --ink-primary: #2E2822; --ink-secondary: #7A6F63;
    --accent: #C4714B; --accent-quiet: #E8D5C4; --ink-on-accent: #FFFEFB;
    --border-subtle: #EBDFCF;
    --radius-card: 12px; --radius-sm: 8px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --font-display: 'Cormorant Garamond', serif; --font-body: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #dcd8de; display: flex; justify-content: center; padding: 40px 20px; font-family: var(--font-body); }
  .num { font-feature-settings: "lnum" 1, "tnum" 1; }
  .screen { width: 393px; height: 852px; background: var(--surface-page); border-radius: 34px; box-shadow: 0 16px 50px rgba(60,40,60,0.18); position: relative; overflow: hidden; color: var(--ink-primary); display: flex; flex-direction: column; }

  .content { flex: 1; overflow-y: auto; padding: 70px var(--space-5) 110px; }
  .content::-webkit-scrollbar { width: 0; }
  .page-title { font-family: var(--font-display); font-weight: 600; font-size: 30px; margin-bottom: var(--space-5); }

  .profile { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-6); }
  .avatar { width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0; background: var(--accent-quiet); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 30px; font-family: var(--font-display); position: relative; }
  .avatar .edit { position: absolute; bottom: -2px; right: -2px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--ink-on-accent); display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface-page); }
  .avatar .edit svg { width: 13px; height: 13px; }
  .p-name { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.1; }
  .p-phone { font-size: 13px; color: var(--ink-secondary); margin-top: 2px; }

  .group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-secondary); margin: 0 2px 10px; }
  .field { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-card); padding: 13px 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: between; }
  .field { justify-content: space-between; }
  .field .k { font-size: 12px; color: var(--ink-secondary); }
  .field .v { font-size: 15px; font-weight: 500; margin-top: 2px; }
  .field .v.empty { color: var(--ink-secondary); font-style: italic; font-weight: 400; }
  .field .chev svg { display: block; width: 18px; height: 18px; color: var(--ink-secondary); }

  .row { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-card); padding: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 13px; }
  .row .ic svg { display: block; width: 22px; height: 22px; color: var(--accent); }
  .row .rl { flex: 1; font-size: 15px; font-weight: 500; }
  .row .chev svg { display: block; width: 18px; height: 18px; color: var(--ink-secondary); }

  .demo { margin-top: var(--space-5); border: 1.5px dashed var(--accent); border-radius: var(--radius-card); padding: 15px; background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .demo-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .seg { display: flex; gap: var(--space-2); }
  .seg .opt { flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; background: var(--surface-card); color: var(--ink-secondary); border: 1px solid var(--border-subtle); }
  .seg .opt.on { background: var(--accent); color: var(--ink-on-accent); border-color: var(--accent); }

  .nav { position: absolute; left: 0; bottom: 0; width: 100%; height: 80px; background: var(--surface-card); display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-4) var(--space-6); border-top: 1px solid var(--border-subtle); }
  .nav-item { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-secondary); }
  .nav-item.on { color: var(--accent); }
  .nav-ico svg { display: block; width: 24px; height: 24px; }
  .nlbl { font-family: var(--font-body); font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: 0.6px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="screen">

    <div class="page-title">Your account</div>
    <div class="profile">

    <div class="row"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="rl">Leave trip</span><span class="chev"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>

    <div class="demo">
      <div class="demo-label">Demo · view as</div>
      <div class="seg"><div class="opt on">Planner</div><div class="opt">Bride</div><div class="opt">Guest</div></div>
    </div>
  </div>

</div>

</html>
