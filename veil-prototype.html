<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --surface-page: #F5EDE2; --surface-card: #FFFBF5; --surface-disabled: #E7E1D8;
  --ink-primary: #2E2822; --ink-secondary: #7A6F63;
  --accent: #C4714B; --accent-quiet: #E8D5C4; --ink-on-accent: #FFFEFB;
  --visibility-everyone: #7B9370; --visibility-teased: #D9A566; --visibility-hidden: #8C3A3F;
  --border-subtle: #EBDFCF;
  --radius-card: 12px; --radius-sm: 8px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --font-display:'Cormorant Garamond',serif;--font-body:'DM Sans',sans-serif;
  --elevation:2px 4px 6px rgba(0,0,0,0.15);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#dcd8de;display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 20px 60px;font-family:var(--font-body)}
.num{font-feature-settings:"lnum"1,"tnum"1}

/* role toggle */
.role-toggle{display:flex;gap:6px;background:#fff;padding:6px;border-radius:12px;box-shadow:0 4px 16px rgba(60,40,60,.15)}
.role-toggle button{border:none;background:transparent;font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 18px;border-radius:8px;color:#8a7f78;cursor:pointer;transition:all .15s}
.role-toggle button.on{background:var(--accent);color:#fff}
.role-caption{font-size:12px;color:#6b6470;text-align:center;max-width:393px;line-height:1.45;min-height:34px}
.role-caption b{color:#2E2822}

/* screen shell */
.screen{width:393px;height:852px;background:var(--surface-page);border-radius:34px;box-shadow:0 16px 50px rgba(60,40,60,.18);position:relative;overflow:hidden;color:var(--ink-primary);display:flex;flex-direction:column}
#viewRoot{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* nav */
.nav{flex-shrink:0;width:100%;height:80px;background:var(--surface-card);display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-4) var(--space-6);border-top:1px solid var(--border-subtle)}
.nav-item{width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-secondary);cursor:pointer}
.nav-item.on{color:var(--accent)}
.nav-ico svg{display:block;width:24px;height:24px}
.nlbl{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase}

/* shared */
.top-fixed{flex-shrink:0;width:100%;padding:70px var(--space-5) var(--space-5);display:flex;flex-direction:column;align-items:center;gap:var(--space-5)}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.home-actions{display:flex;width:100%}
.btn-full{width:100%;justify-content:center}
.top-fixed.home-top{gap:var(--space-3);padding-bottom:var(--space-2)}
.page-title{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:48px;letter-spacing:-.5px}
.btn{display:inline-flex;align-items:center;gap:var(--space-1);height:40px;padding:0 20px;border-radius:var(--radius-sm);cursor:pointer}
.btn-primary{background:var(--accent);color:var(--ink-on-accent)}
.btn-quiet{background:var(--accent-quiet);color:var(--ink-primary)}
.btn .ic svg{display:block;width:16px;height:16px}
.btn-label{font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;padding:var(--space-1);white-space:nowrap}
.back-ic{cursor:pointer}.back-ic svg{display:block;width:24px;height:24px}

/* chips + toggles */
.seg{display:flex;gap:var(--space-3)}
.chip{height:40px;padding:0 var(--space-4);border-radius:20px;border:1px solid var(--accent);display:flex;align-items:center;font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-primary);background:transparent;cursor:pointer;transition:all .15s}
.chip.on{background:var(--accent);color:var(--ink-on-accent)}
.seg.static .chip{cursor:default}
.day-chip{width:60px;height:60px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent-quiet);color:var(--ink-primary);cursor:pointer;transition:all .15s}
.day-chip.on{background:var(--accent);color:var(--ink-on-accent)}
.day-chip .dnum{font-family:var(--font-display);font-weight:600;font-size:28px;line-height:28px}
.day-chip .dlbl{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;margin-top:1px}

/* form fields */
.form-head{flex-shrink:0;display:flex;align-items:center;gap:var(--space-3);padding:66px var(--space-5) var(--space-4)}
.form-title{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:28px}
.form-scroll{flex:1;overflow-y:auto;padding:0 var(--space-5) 40px;display:flex;flex-direction:column;gap:20px}
.form-scroll>*{flex-shrink:0}
.form-scroll::-webkit-scrollbar{width:0}
.input{width:100%;min-height:42px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-card);padding:9px var(--space-4);display:flex;align-items:center;justify-content:flex-start;font-size:16px;line-height:24px;color:var(--ink-secondary)}
.input.select{justify-content:space-between}
.input.filled,.textarea.filled{color:var(--ink-primary)}
.btn.btn-flat{background:var(--accent-quiet);color:var(--ink-secondary);cursor:default;opacity:.75}
.close-line{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle)}
.close-line:last-of-type{border-bottom:none}
.close-left{display:flex;flex-direction:column;gap:2px}
.close-name{font-size:16px;line-height:22px;color:var(--ink-primary)}
.close-meta{font-size:13px;color:var(--ink-secondary)}
.close-amt{font-size:16px;white-space:nowrap}
.close-total{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--ink-secondary)}
.close-total .lbl{font-family:var(--font-display);font-weight:600;font-size:22px}
.close-total .amt{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--accent)}
.closed-note{display:flex;align-items:center;gap:10px;border:1px solid var(--visibility-everyone);background:color-mix(in srgb,var(--visibility-everyone) 10%,transparent);border-radius:var(--radius-card);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5)}
.closed-note svg{width:18px;height:18px;color:var(--visibility-everyone);flex-shrink:0}
.closed-note-text{font-size:13px;line-height:1.4;color:var(--visibility-everyone)}
.input .chev svg{display:block;width:24px;height:24px;color:var(--ink-secondary)}
.field-label{font-size:16px;color:var(--ink-primary)}
.section-label{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:28px}
.detail-scroll{flex:1;overflow-y:auto;padding:0 var(--space-5) 40px;display:flex;flex-direction:column;gap:var(--space-5)}
.detail-scroll>*{flex-shrink:0}
.detail-name{font-family:var(--font-display);font-weight:600;font-size:36px;line-height:40px;letter-spacing:-.5px;display:flex;align-items:flex-start;gap:var(--space-3)}
.detail-when{font-size:16px;line-height:22px;color:var(--accent);font-weight:600;margin-top:calc(var(--space-5) * -1 + var(--space-2))}
.d-block{display:flex;flex-direction:column;gap:var(--space-2)}
.d-body{font-size:16px;line-height:24px;color:var(--ink-secondary)}
.d-body.muted{font-style:italic;opacity:.7}
.detail-name .lock{flex-shrink:0;width:22px;height:22px;margin-top:9px;color:var(--visibility-hidden)}
.detail-name .lock svg{width:100%;height:100%}
.group{display:flex;flex-direction:column;gap:var(--space-3)}
.textarea{width:100%;min-height:100px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-card);padding:9px var(--space-4);font-size:16px;color:var(--ink-secondary)}

.checkbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .15s}
.checkbox.on{background:var(--accent)}.checkbox.off{background:var(--surface-card)}
.checkbox svg{width:15px;height:15px;color:var(--ink-on-accent)}

.divider-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink-secondary);padding-bottom:var(--space-2);cursor:pointer}
.divider-row .chev svg{display:block;width:24px;height:24px;color:var(--ink-secondary);transition:transform .2s}
.divider-row .chev.open svg{transform:rotate(180deg)}
.split-list{display:flex;flex-direction:column;gap:var(--space-3);overflow:hidden;transition:max-height .25s,opacity .2s}
.split-list.collapsed{max-height:0;opacity:0}.split-list.expanded{max-height:800px;opacity:1}
.hide-wrap.hidden{display:none}
.split-row{display:flex;align-items:center;justify-content:space-between;min-height:42px}
.split-left{display:flex;align-items:center;gap:var(--space-3)}
.amount-input{width:100px;min-height:42px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-card);padding:9px var(--space-3);display:flex;align-items:center;gap:var(--space-1);font-size:16px;color:var(--ink-secondary)}

.hide-wrap{display:flex;align-items:center;gap:var(--space-2);cursor:pointer;flex-shrink:0}
.hide-label{font-size:13px;color:var(--ink-secondary)}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.off{background:var(--accent-quiet)}.toggle.on{background:var(--accent)}
.toggle .knob{position:absolute;top:2px;width:22px;height:22px;border-radius:50%;background:var(--surface-card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle.off .knob{left:2px}.toggle.on .knob{left:20px}

.bride-split{display:flex;flex-direction:column;gap:6px}
.bride-top{display:flex;align-items:center;justify-content:space-between}
.bride-bottom{display:flex;align-items:center;justify-content:flex-end}
.bride-bottom.hidden{display:none}

.bride-pays{display:flex;align-items:center;gap:var(--space-3);cursor:pointer;transition:opacity .2s}
.bride-pays.bphidden{opacity:0;height:0;overflow:hidden;margin:0;padding:0;pointer-events:none}

.vis-picker{display:flex;gap:var(--space-2)}
.vis-opt{height:40px;padding:0 var(--space-3);border-radius:20px;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-primary);background:transparent;flex:1;cursor:pointer;transition:all .15s}
.vis-opt.on{background:var(--accent);color:var(--ink-on-accent)}

.btn-outline{width:100%;min-height:40px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:transparent;display:flex;align-items:center;justify-content:center;gap:var(--space-1);color:var(--accent)}
.btn-outline .ic svg{display:block;width:16px;height:16px}
.btn-save{width:100%;min-height:40px;border-radius:var(--radius-sm);background:var(--accent);color:var(--ink-on-accent);display:flex;align-items:center;justify-content:center}

/* --- HOME timeline --- */
.countdown{display:flex;align-items:center;justify-content:center;gap:var(--space-1);font-family:var(--font-display);font-weight:600}
.countdown .word{font-size:22px;color:var(--ink-secondary)}.countdown .days{font-size:44px;letter-spacing:-.5px;color:var(--accent)}
.header-title-wrap{width:100%;border-bottom:1px solid var(--border-subtle);padding:var(--space-2) 0}
.header-title{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:48px;letter-spacing:-.5px}
.date-selector{display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-2);width:100%}
.timeline-scroll{flex:1;overflow-y:auto;padding:var(--space-2) var(--space-5) 40px;margin-top:0}
.timeline-scroll::-webkit-scrollbar{width:0}
.timegrid{position:relative;width:100%}
.hour-row{position:absolute;left:0;width:100%;height:0}
.hour-tick{position:absolute;left:0;top:-8px;width:34px;text-align:right;font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-secondary)}
.hour-line{position:absolute;left:42px;right:0;top:0;border-top:1px solid var(--border-subtle)}
.events-layer{position:absolute;left:42px;right:0;top:0;bottom:0}
.ac{position:absolute;left:6px;right:0;cursor:pointer;background:var(--surface-card);border-left:2px solid var(--visibility-everyone);border-right:2px solid var(--visibility-everyone);border-radius:var(--radius-card);padding:0 var(--space-3);overflow:hidden}
.ac .inner{height:100%;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);padding:8px 0;display:flex;flex-direction:column}
.ac .aname{font-weight:400;font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .ameta{font-weight:400;font-size:13px;line-height:18px;letter-spacing:.1px;color:var(--ink-secondary);margin-top:2px}
.ac.half{border-left-color:var(--visibility-teased);border-right-color:var(--visibility-teased)}
.ac.teased{border-left-color:var(--visibility-teased);border-right-color:var(--visibility-teased);background:color-mix(in srgb,var(--visibility-teased) 10%,var(--surface-card))}
.ac.teased .inner{border:none;justify-content:center}.ac.teased .aname{color:var(--visibility-teased)}
.ac.secret{border:1px dashed var(--visibility-hidden)}.ac.secret .inner{border:none}
.ac .badge,.ac .secret-badge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:10px;background:var(--visibility-hidden);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ac .badge svg,.ac .secret-badge svg{width:12px;height:12px;color:var(--ink-on-accent)}

/* --- EXPENSES --- */
.total-card{position:relative;width:100%;min-height:142px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:30px 28px 24px}
.owe-label{font-weight:600;font-size:12px;line-height:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-secondary)}
.owe-amount{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:48px;letter-spacing:-.22px}
.total-card .actions{position:absolute;right:24px;top:25px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.exp-scroll{flex:1;width:100%;overflow-y:auto;padding:4px var(--space-5) 40px}
.exp-scroll::-webkit-scrollbar{width:0}
.exp-list{display:flex;flex-direction:column;gap:var(--space-4);width:100%}
.sect-label{font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-secondary);margin:var(--space-2) 2px -4px}
.exp-card{position:relative;width:100%;cursor:pointer;filter:drop-shadow(var(--elevation))}
.exp-inner{width:100%;min-height:72px;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-3) var(--space-5) var(--space-2);border-radius:var(--radius-card);background:var(--surface-card);overflow:hidden}
.exp-card.pending{filter:none}.exp-card.pending .exp-inner{background:transparent;border:1px dashed var(--ink-secondary)}
.exp-row{display:flex;align-items:center;justify-content:space-between;width:100%}
.exp-name{font-weight:400;font-size:16px;line-height:24px}
.exp-amount{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:28px}
.exp-date,.exp-total{font-weight:400;font-size:13px;line-height:18px;letter-spacing:.1px;color:var(--ink-secondary)}
.exp-sub{font-size:12px;color:var(--ink-secondary);margin-top:2px}
.badge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:2}
.badge.pin{background:var(--accent)}.badge.secret{background:var(--visibility-hidden)}
.badge svg{width:12px;height:12px;color:var(--ink-on-accent)}

/* settle */
.settle-head{flex-shrink:0;display:flex;align-items:center;gap:var(--space-3);padding:66px var(--space-5) var(--space-4)}
.head-title{font-family:var(--font-display);font-weight:600;font-size:30px}
.settle-body{flex:1;overflow-y:auto;padding:0 var(--space-5) 40px}.settle-body::-webkit-scrollbar{width:0}
.warn{border:1px solid var(--visibility-hidden);background:color-mix(in srgb,var(--visibility-hidden) 7%,transparent);border-radius:var(--radius-card);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5);display:flex;align-items:center;gap:10px}
.warn svg{width:18px;height:18px;color:var(--visibility-hidden);flex-shrink:0}
.warn-text{font-size:13px;line-height:1.4;color:var(--visibility-hidden)}
.owe-line{font-family:var(--font-display);font-weight:600;font-size:26px;margin-bottom:var(--space-2)}.owe-line .amt{color:var(--accent)}
.send-to{font-weight:600;font-size:15px;color:var(--ink-secondary);margin:var(--space-5) 0 var(--space-3)}.send-to .amt{color:var(--ink-primary);font-size:18px}
.pay-card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:var(--space-4);display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-3)}
.pc-av{width:52px;height:52px;border-radius:50%;flex-shrink:0;object-fit:cover}
.pc-name{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1.1}
.pc-handle{font-size:12px;color:var(--ink-secondary);margin-top:3px;display:flex;gap:var(--space-1)}.pc-handle .lbl{font-weight:600}
.done-btn{width:100%;min-height:48px;border-radius:var(--radius-sm);background:var(--accent);color:var(--ink-on-accent);display:flex;align-items:center;justify-content:center;margin-top:var(--space-5);font-weight:600;font-size:14px;letter-spacing:.4px;cursor:pointer}

/* --- MESSAGES --- */
.list-scroll{flex:1;width:100%;overflow-y:auto;padding:4px var(--space-5) 40px}.list-scroll::-webkit-scrollbar{width:0}
.board-list{display:flex;flex-direction:column;gap:var(--space-4);width:100%}
.board{position:relative;width:100%;filter:drop-shadow(var(--elevation));cursor:pointer}
.board-inner{display:flex;flex-direction:column;gap:var(--space-1);height:72px;padding:var(--space-3) 20px var(--space-2);border-radius:var(--radius-card);background:var(--surface-card);border:1px solid var(--visibility-everyone);overflow:hidden}
.board.announce .board-inner{border-color:var(--accent)}
.board.plusbride .board-inner{border-color:var(--visibility-everyone)}
.board.nobride .board-inner{border:1px dashed var(--visibility-hidden)}
.board.read .board-inner{background:var(--surface-disabled)}
.board-name{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-prev{display:flex;gap:var(--space-1);align-items:center;width:100%;overflow:hidden}
.prev-sender{font-size:13px;white-space:nowrap}.prev-text{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.thread-head{flex-shrink:0;display:flex;align-items:center;gap:var(--space-3);padding:66px var(--space-5) var(--space-4);border-bottom:1px solid var(--border-subtle);background:var(--surface-card)}
.thread-title{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:26px}
.nobride-tag{font-size:12px;color:var(--ink-secondary);font-weight:600}
.thread-sub{font-size:12px;color:var(--ink-secondary)}
.thread{flex:1;overflow-y:auto;padding:var(--space-5) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}.thread::-webkit-scrollbar{width:0}
.divider{text-align:center;font-size:11px;color:var(--ink-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:var(--space-2) 0}
.row{display:flex;align-items:flex-end;gap:var(--space-2);max-width:88%}
.row.right{align-self:flex-end;flex-direction:row-reverse}.row.left{align-self:flex-start}
.avatar{width:28px;height:28px;border-radius:20px;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.mc{position:relative;display:flex;flex-direction:column;gap:var(--space-1);max-width:274px;width:236px;padding:10px var(--space-3);border-radius:var(--radius-card);overflow:visible}
.mc .body-text{font-size:13px;line-height:18px;letter-spacing:.1px}
.mc .time{font-size:11px;line-height:16px;letter-spacing:.066em;text-transform:uppercase;text-align:right;width:100%}
.mc .ann-label{font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.mc .sender{font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#000}
.mc.self{background:var(--accent)}.mc.self .body-text,.mc.self .time{color:var(--ink-on-accent)}
.mc.other{background:var(--surface-card);border:1px solid var(--border-subtle)}.mc.other .body-text{color:var(--ink-primary)}.mc.other .time{color:var(--ink-secondary)}
.mc.ann-self{background:var(--accent)}.mc.ann-self .ann-label,.mc.ann-self .body-text,.mc.ann-self .time{color:var(--ink-on-accent)}
.mc.ann-other{background:var(--accent-quiet);border:1px solid var(--accent)}.mc.ann-other .ann-label{color:var(--accent)}.mc.ann-other .body-text,.mc.ann-other .time{color:var(--ink-primary)}
.mc.ann-secret{background:var(--accent-quiet);border:1px dashed var(--accent)}.mc.ann-secret .ann-label{color:var(--accent)}.mc.ann-secret .body-text,.mc.ann-secret .time{color:var(--ink-primary)}
.mc .secret-badge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:10px;background:var(--visibility-hidden);display:flex;align-items:center;justify-content:center;overflow:hidden}.mc .secret-badge svg{width:12px;height:12px;color:var(--ink-on-accent)}
.ann-source{font-size:10px;color:var(--ink-secondary);letter-spacing:.04em;margin-bottom:2px}
.composer{flex-shrink:0;border-top:1px solid var(--border-subtle);background:var(--surface-card);padding:var(--space-3) var(--space-4) var(--space-5)}
.compose-toggle{display:flex;align-items:center;gap:var(--space-2);margin-bottom:10px;font-size:12px;color:var(--ink-secondary);cursor:pointer}
.cbox{width:20px;height:20px;border-radius:5px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbox.on{background:var(--accent)}.cbox.off{background:var(--surface-card)}
.cbox svg{width:13px;height:13px;color:var(--ink-on-accent)}
.ct-b{color:var(--ink-primary);font-weight:600}
.secret-note{color:var(--visibility-hidden);font-weight:600}
.compose-row{display:flex;align-items:center;gap:var(--space-3)}
.cinput{flex:1;min-height:44px;border-radius:22px;background:var(--surface-page);border:1px solid var(--border-subtle);padding:0 16px;display:flex;align-items:center;font-size:14px;color:var(--ink-secondary)}
.send{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--accent);color:var(--ink-on-accent);display:flex;align-items:center;justify-content:center}.send svg{width:20px;height:20px}

/* --- ACCOUNT --- */
.acct-scroll{flex:1;overflow-y:auto;padding:70px var(--space-5) 40px}.acct-scroll::-webkit-scrollbar{width:0}
.profile{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-6)}
.prof-av{width:76px;height:76px;border-radius:50%;flex-shrink:0;object-fit:cover}
.p-name{font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1.1}
.p-phone{font-size:13px;color:var(--ink-secondary);margin-top:2px}
.group-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-secondary);margin:0 2px 10px}
.acct-field{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.acct-field .k{font-size:12px;color:var(--ink-secondary)}.acct-field .v{font-size:15px;font-weight:500;margin-top:2px}
.acct-field .v.empty{color:var(--ink-secondary);font-style:italic;font-weight:400}
.acct-field .chev svg,.acct-row .chev svg{display:block;width:18px;height:18px;color:var(--ink-secondary)}
.acct-row{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:13px}
.acct-row .a-ic svg{display:block;width:22px;height:22px;color:var(--accent)}
.acct-row .rl{flex:1;font-size:15px;font-weight:500}
.demo{margin-top:var(--space-5);border:1.5px dashed var(--accent);border-radius:var(--radius-card);padding:15px;background:color-mix(in srgb,var(--accent) 5%,transparent)}
.demo-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.demo-seg{display:flex;gap:var(--space-2)}
.demo-seg .opt{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:13px;font-weight:600;background:var(--surface-card);color:var(--ink-secondary);border:1px solid var(--border-subtle);cursor:pointer}
.demo-seg .opt.on{background:var(--accent);color:var(--ink-on-accent);border-color:var(--accent)}
.empty-msg{text-align:center;color:var(--ink-secondary);font-size:15px;padding:40px 20px}
</style>
</head>

const HPX=132,MPX=HPX/60;
function resolveEv(ev,role){if(ev.vis==="everyone")return{render:true,mode:"default"};if(ev.vis==="secret")return role==="bride"?{render:false}:{render:true,mode:"secret"};if(ev.vis==="teased")return role==="bride"?{render:true,mode:"teased"}:{render:true,mode:"half"};return{render:true,mode:"default"};}

function renderHome(){
  let h=`<div class="top-fixed home-top"><div class="header"><div class="header-title-wrap"><div class="header-title">Get pumped for Nidhi's Bach</div></div><div class="countdown"><span class="word">in</span><span class="days num">23</span><span class="word">days</span></div></div>${currentRole==="planner"?`<div class="home-actions"><div class="btn btn-primary btn-full" id="addActBtn"><span class="ic">${svg("plus")}</span><span class="btn-label">Add activity</span></div></div>`:""}<div class="date-selector" id="daySelector"></div></div><div class="timeline-scroll"><div class="timegrid" id="timegrid"></div></div>`;
  return h;
}
function bindHome(){
  document.getElementById("addActBtn")?.addEventListener("click",()=>{currentView="home-add";splitOpen=false;hideOn=false;actVis="everyone";bridePaysCk=true;render();});
  const ds=document.getElementById("daySelector");
  ds.innerHTML=DAYS.map(d=>`<div class="day-chip ${d.n===currentDay?"on":""}" data-day="${d.n}"><span class="dnum num">${d.n}</span><span class="dlbl">${d.label}</span></div>`).join("");
  ds.querySelectorAll(".day-chip").forEach(c=>c.addEventListener("click",()=>{currentDay=+c.dataset.day;bindHome();}));
  const role=currentRole,dayEvts=EVENTS.map((e,i)=>({ev:e,i,res:resolveEv(e,role)})).filter(x=>x.ev.day===currentDay&&x.res.render);
  const grid=document.getElementById("timegrid");
  if(!dayEvts.length){grid.style.height="200px";grid.innerHTML='<div class="empty-msg">Nothing planned yet for this day.</div>';return;}
  const fs=Math.min(...dayEvts.map(x=>x.ev.start)),le=Math.max(...dayEvts.map(x=>x.ev.end));
  const sh=Math.floor(fs/60),eh=Math.ceil(le/60),base=sh*60;
  let hh="";for(let i=sh;i<=eh;i++){const top=(i*60-base)*MPX;hh+=`<div class="hour-row" style="top:${top}px"><span class="hour-tick">${fmtHour(i)}</span><div class="hour-line"></div></div>`;}
  let ev="";dayEvts.forEach(({ev:e,i,res})=>{const top=(e.start-base)*MPX,ht=(e.end-e.start)*MPX;
    if(res.mode==="teased"){ev+=`<div class="ac teased" data-i="${i}" style="top:${top}px;height:${ht}px"><div class="inner"><div class="aname">Something's planned for you\u2026</div><div class="ameta">${fmtTime(e.start)} \u00b7 just show up!</div></div></div>`;}
    else{const cls=res.mode==="secret"?"secret":res.mode==="half"?"half":"";const bdg=(res.mode==="secret"||res.mode==="half")?`<div class="secret-badge">${svg("lock")}</div>`:"";
      ev+=`<div class="ac ${cls}" data-i="${i}" style="top:${top}px;height:${ht}px"><div class="inner"><div class="aname">${e.name}</div><div class="ameta num">${fmtTime(e.start)}\u2013${fmtTime(e.end)} \u00b7 at ${e.loc}</div></div>${bdg}</div>`;}});
  grid.style.height=((eh-sh)*HPX+24)+"px";grid.innerHTML=hh+'<div class="events-layer">'+ev+'</div>';
  grid.querySelectorAll(".ac").forEach(c=>c.addEventListener("click",()=>{openAct=+c.dataset.i;currentView="home-view";render();}));
}

const EXPENSES=[
  {id:"airbnb",name:"Airbnb",date:"01/15/26",total:217015,payer:"selena",split:ALL,secret:false,status:"confirmed"},
  {id:"hibachi",name:"Hibachi chef",date:"02/19/26",total:120015,payer:"shalini",split:ALL,secret:false,status:"confirmed"},
  {id:"yoga",name:"Yoga class",date:"03/15/26",total:35015,payer:"martha",split:ALL,secret:false,status:"confirmed"},
  {id:"brunch",name:"Brunch Sunday",date:"01/20/26",total:20550,payer:"priya",split:ALL,secret:false,status:"confirmed"},
  {id:"fire",name:"Surprise fire show",date:"02/19/26",total:25000,payer:"shalini",split:NOBRIDE,secret:true,status:"confirmed"},
  {id:"spa",name:"Spa surprise",date:"03/15/26",total:35000,payer:"priya",split:NOBRIDE,secret:true,status:"pending",sub:"priya"},
  {id:"decor",name:"Balloons & decor",date:"03/02/26",total:9600,payer:"martha",split:ALL,secret:false,status:"pending",sub:"martha"}
];
function expVisible(exp,role){if(exp.secret&&role==="bride")return false;if(exp.status==="pending"){if(role==="planner")return true;return exp.sub===VIEWER[role];}return true;}
function sharesOf(exp){const n=exp.split.length,b=Math.floor(exp.total/n),r=exp.total-b*n,o={};exp.split.forEach(m=>o[m]=b);o[exp.split.includes(exp.payer)?exp.payer:exp.split[0]]+=r;return o;}
function balances(role){const bal={};ALL.forEach(m=>bal[m]=0);EXPENSES.filter(e=>e.status==="confirmed"&&expVisible(e,role)).forEach(e=>{bal[e.payer]+=e.total;const sh=sharesOf(e);Object.keys(sh).forEach(m=>bal[m]-=sh[m]);});return bal;}
function settlements(role){const bal=balances(role),d=[],c=[];ALL.forEach(m=>{if(bal[m]<0)d.push([m,-bal[m]]);else if(bal[m]>0)c.push([m,bal[m]]);});d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;while(i<d.length&&j<c.length){const a=Math.min(d[i][1],c[j][1]);if(a)out.push({from:d[i][0],to:c[j][0],amount:a});d[i][1]-=a;c[j][1]-=a;if(!d[i][1])i++;if(!c[j][1])j++;}return out;}

function renderExpenses(){
  const role=currentRole,me=VIEWER[role],bal=balances(role),net=bal[me];
  const visible=EXPENSES.filter(e=>expVisible(e,role)),confirmed=visible.filter(e=>e.status==="confirmed"),pending=visible.filter(e=>e.status==="pending");
  const label=net<0?"You owe":net>0?"You're owed":"You're settled up",amount=net===0?"":(`<div class="owe-amount num">${money(Math.abs(net))}</div>`);
  const closeBtn=role==="planner"?(tabClosed?`<div class="btn btn-flat"><span class="btn-label">Tab closed</span></div>`:`<div class="btn btn-primary" id="closeOutBtn"><span class="btn-label">Close out</span></div>`):"";
  // once the tab is closed the amount owed is final, so settling up becomes the action to take
  const settleBtn=`<div class="btn ${tabClosed&&role!=="planner"?"btn-primary":"btn-quiet"}" id="settleBtn"><span class="btn-label">Settle up</span></div>`;
  const pendingBlock=pending.length?`<div class="sect-label">${role==="planner"?"Pending approval":"Your pending"}</div>`+pending.map(e=>expCard(e,role)).join(""):"";
  return`<div class="top-fixed"><div class="head-row"><div class="page-title">Expenses</div><div class="btn btn-primary" id="addExpBtn"><span class="ic">${svg("plus")}</span><span class="btn-label">Add</span></div></div>
    <div class="total-card"><div class="owe-label">${label}</div>${amount}<div class="actions">${closeBtn}${settleBtn}</div></div></div>
    <div class="exp-scroll"><div class="exp-list">${pendingBlock}${pending.length?'<div class="sect-label">Confirmed</div>':""}${confirmed.map(e=>expCard(e,role)).join("")}</div></div>`;
}
function expCard(e,role){const me=VIEWER[role],sh=sharesOf(e),mine=sh[me]||0,pending=e.status==="pending";
  const bdg=(e.secret&&role!=="bride")?`<div class="badge secret">${svg("lock")}</div>`:"";
  let sub="";if(pending)sub=role==="planner"?`<div class="exp-sub">Pending \u00b7 submitted by ${MEMBERS[e.sub].name}</div>`:`<div class="exp-sub">Pending approval</div>`;
  return`<div class="exp-card ${pending?"pending":""}" data-exp="${e.id}"><div class="exp-inner"><div class="exp-row"><span class="exp-name">${e.name}</span><span class="exp-amount num">${money(mine)}</span></div><div class="exp-row"><span class="exp-date num">${e.date}</span><span class="exp-total">Total cost:\u00a0<span class="num">${money(e.total)}</span></span></div>${sub}</div>${bdg}</div>`;}
function bindExpenses(){
  document.getElementById("settleBtn")?.addEventListener("click",()=>{currentView="expenses-settle";render();});
  document.getElementById("closeOutBtn")?.addEventListener("click",()=>{currentView="expenses-close";render();});

function renderSettle(){
  const role=currentRole,me=VIEWER[role],bal=balances(role),net=bal[me],mine=settlements(role).filter(t=>t.from===me||t.to===me);
  let headline,rows;
  if(net<0){headline=`<div class="owe-line">You owe <span class="amt num">${money(-net)}</span></div>`;

  else{headline=`<div class="owe-line">You're all settled up.</div>`;rows="";}
  return`<div class="settle-head"><span class="back-ic" id="backBtn">${svg("back")}</span><span class="head-title">Settle your tab</span></div>

}

function canSeeBoard(b,role){if(b.id==="announcements")return true;return b.members.includes(VIEWER[role]);}
function visSrcBoards(role){return BOARDS.filter(b=>b.id!=="announcements"&&canSeeBoard(b,role)).map(b=>b.id);}
function lastPrev(b,role){if(b.id==="announcements"){const srcs=visSrcBoards(role),anns=[];for(const bid of Object.keys(MSGS)){if(role==="bride"&&!srcs.includes(bid))continue;MSGS[bid].filter(m=>m.ann).forEach(m=>anns.push(m));}return anns.length?anns[anns.length-1]:null;}return(MSGS[b.id]||[]).slice(-1)[0]||null;}

function renderMessages(){
  const role=currentRole,boards=BOARDS.filter(b=>canSeeBoard(b,role)),canAdd=role==="planner";
  let h=`<div class="top-fixed"><div class="head-row"><div class="page-title">Messages</div>${canAdd?`<div class="btn btn-primary"><span class="ic">${svg("plus")}</span><span class="btn-label">Add</span></div>`:""}</div></div><div class="list-scroll"><div class="board-list">`;
  boards.forEach(b=>{const last=lastPrev(b,role);const prev=last?`<div class="board-prev"><span class="prev-sender">${MEMBERS[last.from].name}:</span><span class="prev-text">${last.text}</span></div>`:`<div class="board-prev"><span class="prev-text" style="color:var(--ink-secondary)">No messages yet</span></div>`;
    let bdg="";if(b.type==="announce")bdg=`<div class="badge pin">${svg("pin")}</div>`;else if(b.noBride)bdg=`<div class="badge secret">${svg("lock")}</div>`;
    h+=`<div class="board ${b.type} ${b.read?"read":""}" data-bid="${b.id}"><div class="board-inner"><div class="board-name">${b.name}</div>${prev}</div>${bdg}</div>`;});
  return h+`</div></div>`;
}
function bindMessages(){document.querySelectorAll(".board[data-bid]").forEach(el=>el.addEventListener("click",()=>{openBoard=el.dataset.bid;currentView="messages-thread";render();}));}

function renderThread(boardId){
  const role=currentRole,me=VIEWER[role],board=BOARDS.find(b=>b.id===boardId),isAnn=boardId==="announcements",canCompose=!isAnn,canAnnounce=role==="planner"&&canCompose;
  let titleHTML;if(isAnn)titleHTML=`<div class="thread-title">Announcements</div>`;
  else{const tag=board.noBride?` <span class="nobride-tag">(NO BRIDE)</span>`:"";titleHTML=`<div class="thread-title">${board.name.replace("+ THE BRIDE","").trim()}${tag}</div><div class="thread-sub num">${board.members.length} members</div>`;}
  let h=`<div class="thread-head"><span class="back-ic" id="backBtn">${svg("back")}</span><div>${titleHTML}</div></div><div class="thread"><div class="divider">Today</div>`;
  const renderMsg=(m,secret,isSelf)=>{const side=isSelf?"right":"left";const sn=isSelf?"":(`<div class="sender">${MEMBERS[m.from].name}</div>`);
    if(m.ann){const cls=secret?"ann-secret":(isSelf?"ann-self":"ann-other");const sb=secret?`<div class="secret-badge">${svg("lock")}</div>`:"";
      return`<div class="row ${side}"><div class="avatar"><img src="${AVATARS[m.from]}" alt=""></div><div class="mc ${cls}">${sb}${m.source?`<div class="ann-source">from ${m.source}</div>`:""}<div class="ann-label">Announcement</div>${sn}<div class="body-text">${m.text}</div><div class="time num">${m.time}</div></div></div>`;}
    const cls=isSelf?"self":"other";return`<div class="row ${side}"><div class="avatar"><img src="${AVATARS[m.from]}" alt=""></div><div class="mc ${cls}">${sn}<div class="body-text">${m.text}</div><div class="time num">${m.time}</div></div></div>`;};
  if(isAnn){const srcs=visSrcBoards(role);for(const[bid,msgs]of Object.entries(MSGS)){const sb=BOARDS.find(b=>b.id===bid);if(role==="bride"&&!srcs.includes(bid))continue;msgs.filter(m=>m.ann).forEach(m=>{const secret=sb.noBride&&role!=="bride";h+=renderMsg({...m,source:sb.name},secret,m.from===me);});}
  }else{(MSGS[boardId]||[]).forEach(m=>{h+=renderMsg(m,board.noBride,m.from===me);});}
  h+=`</div>`;
  if(canCompose){let tog="";if(canAnnounce){const defaultOn=board.noBride;const secretSpan=board.noBride?` \u00b7 <span class="secret-note">secret from the bride</span>`:"";
    tog=`<div class="compose-toggle" id="annToggle" data-on="${defaultOn}"><div class="cbox ${defaultOn?"on":"off"}" id="annCbox">${defaultOn?svgC("check"):""}</div><span><span class="ct-b">Post as announcement</span>${secretSpan}</span></div>`;}
    h+=`<div class="composer">${tog}<div class="compose-row"><div class="cinput">Message...</div><div class="send">${svg("send")}</div></div></div>`;}
  return h;
}
function bindThread(){
  document.getElementById("backBtn").addEventListener("click",()=>{currentView="messages";openBoard=null;render();});
  const t=document.querySelector(".thread");if(t)t.scrollTop=t.scrollHeight;
  document.getElementById("annToggle")?.addEventListener("click",()=>{const tog=document.getElementById("annToggle"),on=tog.dataset.on==="true",next=!on;tog.dataset.on=next;const cb=document.getElementById("annCbox");cb.className="cbox "+(next?"on":"off");cb.innerHTML=next?svgC("check"):"";});
}

/* ========== ACCOUNT ========== */
function renderAccount(){
  const me=VIEWER[currentRole];
  const chevR='<span class="chev"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  return`<div class="acct-scroll">
    <div class="page-title" style="margin-bottom:var(--space-5)">Your account</div>
    <div class="profile"><img class="prof-av" src="${AVATARS[me]}" alt=""><div><div class="p-name">${MEMBERS[me].name}</div><div class="p-phone num">+1 ${MEMBERS[me].zelle}</div></div></div>
    <div class="group-label">Payment handles</div>
    <div class="acct-field"><div><div class="k">Venmo</div><div class="v">${MEMBERS[me].venmo}</div></div>${chevR}</div>
    <div class="acct-field"><div><div class="k">Zelle</div><div class="v num">${MEMBERS[me].zelle}</div></div>${chevR}</div>
    <div class="group-label" style="margin-top:22px">Settings</div>
    <div class="acct-row"><span class="a-ic"><svg viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="rl">Notifications</span>${chevR}</div>
    <div class="acct-row"><span class="a-ic"><svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="rl">Leave trip</span>${chevR}</div>
    <div class="demo"><div class="demo-label">Demo \u00b7 view as</div><div class="demo-seg" id="acctRoleSeg"><div class="opt ${currentRole==="planner"?"on":""}" data-role="planner">Planner</div><div class="opt ${currentRole==="bride"?"on":""}" data-role="bride">Bride</div><div class="opt ${currentRole==="guest"?"on":""}" data-role="guest">Guest</div></div></div>
  </div>`;
}
function bindAccount(){document.getElementById("acctRoleSeg").addEventListener("click",e=>{const o=e.target.closest(".opt");if(!o)return;currentRole=o.dataset.role;render();});}

/* ========== MASTER RENDER ========== */
const SCROLLERS=".form-scroll,.list-scroll,.acct-scroll,.timeline-scroll,.detail-scroll";
let lastView=null;
function render(){
  document.querySelectorAll("#roleToggle button").forEach(b=>b.classList.toggle("on",b.dataset.role===currentRole));
  document.getElementById("roleCaption").innerHTML=getCaption();
  renderNav();
  const root=document.getElementById("viewRoot");
  // keep the scroll position when re-rendering the same view in place
  const prev=root.querySelector(SCROLLERS),keepScroll=lastView===currentView?(prev?prev.scrollTop:0):0;
  switch(currentView){
    case"home":root.innerHTML=renderHome();bindHome();break;
    case"home-add":root.innerHTML=renderAddActivity();bindAddActivity();break;
    case"home-view":root.innerHTML=renderViewActivity();bindViewActivity();break;
    case"expenses":root.innerHTML=renderExpenses();bindExpenses();break;
    case"expenses-settle":root.innerHTML=renderSettle();bindSettle();break;
    case"expenses-add":root.innerHTML=renderAddExpense();bindAddExpense();break;
    case"expenses-close":root.innerHTML=renderCloseOut();bindCloseOut();break;
    case"expenses-view":root.innerHTML=renderViewExpense();bindViewExpense();break;
    case"messages":root.innerHTML=renderMessages();bindMessages();break;
    case"messages-thread":root.innerHTML=renderThread(openBoard);bindThread();break;
    case"account":root.innerHTML=renderAccount();bindAccount();break;
  }
  if(keepScroll){const now=root.querySelector(SCROLLERS);if(now)now.scrollTop=keepScroll;}
  lastView=currentView;
  // if switching role while in a board the role can't see, bounce to list
  if(currentView==="messages-thread"&&openBoard&&openBoard!=="announcements"){const b=BOARDS.find(x=>x.id===openBoard);if(b&&!canSeeBoard(b,currentRole)){currentView="messages";openBoard=null;render();}}
}
document.querySelectorAll("#roleToggle button").forEach(b=>b.addEventListener("click",()=>{currentRole=b.dataset.role;render();}));
render();

</script>
</body>
