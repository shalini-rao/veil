];
function onbThemeCard(t){
  return`<div class="onb-theme ${t.cls} ${onb.theme===t.id?"on":""}" data-theme="${t.id}">
    <div class="tb"><div class="tl"><div class="tt">${PARTY.name}</div><div class="ts">Body text</div><div class="tc">Caption</div></div>
    <div class="tr"><div class="tbtn">${onb.theme===t.id?"Chosen":"Choose theme"}</div>
    <div class="sws">${t.sw.map(c=>`<div class="sw" style="background:${c}"></div>`).join("")}</div></div></div>
    <div class="tf">${t.name}</div></div>`;
}

function renderOnb(){
  const s=onbStep();
  switch(s){
    case"splash":
      return`<div class="onb theme-neutral" id="onbSplash"><div class="onb-scroll"><div class="onb-center">${onbLogo(250)}</div></div></div>`;

    case"invite":{
      const hey=onb.entry==="bride"?"Hey BRIDE!":null;
      const verb=onb.entry==="planner"?"You've been invited to help plan":"You've been invited to join";
      return onbShell(`<div class="onb-center"><div class="onb-inv-pre">Welcome to</div>${onbLogo(210,"margin:6px auto 0")}
        ${hey?`<div class="onb-inv-hey">${hey}</div>`:""}
        <div class="onb-inv-body" style="margin-top:${hey?12:30}px"><span class="v">${verb}</span><span class="onb-inv-party">${PARTY.name}</span></div></div>`,
        onbCta("Get started"));
    }

    case"phone":
      return onbShell(`${onbLogo(200,"margin-bottom:108px")}
        <div class="onb-field"><div class="onb-label">Phone number</div>
          ${onbField("phone","Enter your phone number","+1 555 666 9999")}</div>`,
        onbCta("Continue"));

    case"profile":
      return onbShell(`${onbLogo(150,"margin-bottom:34px")}
        <div class="onb-field"><div class="onb-label">How do you want your name displayed?</div>
          ${onbField("name","What's your name?","Shalini")}</div>
        <div class="onb-field"><div class="onb-label">Add a photo if you like<span class="opt">Optional</span></div>
          <div class="onb-photo" data-fill="photo">${onb.filled.photo?`<img src="${AVATARS.shalini}" alt="">`:ONB_CAM}</div></div>
        <div class="onb-field"><div class="onb-label">To make expenses easier<span class="opt">Optional</span></div>
          ${onbField("venmo","Venmo handle","@shalini")}${onbField("zelle","Zelle handle","555 666 9999")}</div>`,
        onbCta(onb.entry==="fresh"?"Continue":"Join "+PARTY.name));

    case"name":
      return onbShell(`${onbLogo(150,"margin-bottom:34px")}<div class="onb-welcome">Welcome in, Shalini</div>
        <div class="onb-field"><div class="onb-label">What are we planning?</div>
          ${onbField("event","Event name","Nidhi's Bach")}</div>`,
        onbCta("Continue"));

    case"dates":
      return onbShell(`${onbLogo(150,"margin-bottom:34px")}<div class="onb-welcome">Let's plan ${PARTY.name}</div>
        <div class="onb-q-label" style="text-align:center;margin-bottom:14px">When is it?</div>${onbDatepicker()}`,
        onbCta("Continue"));

    case"roles":{
      let h=onbParty();
      h+=onbQ("q1","Are you the only planner?",[{v:"yes",l:"Yes, just me"},{v:"no",l:"No"}]);
      if(onb.q1)h+=onbQ("q2","Are you the bride?",[{v:"yes",l:"Yes"},{v:"no",l:"No"}]);
      if(onbShowQ3())h+=onbQ("q3","Is the bride helping plan?",[{v:"yes",l:"Yes"},{v:"no",l:"No"}]);
      if(onbShowQ4())h+=onbQ("q4","Do you want surprises to be hidden from you?",[{v:"yes",l:"Yes"},{v:"no",l:"No"}]);
      return onbShell(h,onbCta("Continue"));
    }

    case"details":
      return onbShell(`${onbParty()}
        <div class="onb-field"><div class="onb-label">Where is ${PARTY.name} happening?</div>
          ${onbField("loc","Location",PARTY.loc)}</div>
        <div class="onb-q-label" style="margin-bottom:12px">Pick a theme for the ${PARTY.name} page</div>
        ${ONB_THEMES.map(onbThemeCard).join("")}`,
        onbCta("Continue"),"tight");

    case"seed":{
      const day=onb.day,pool=EVENTS.filter(e=>e.day===day),n=onb.seeded[day]||0,shown=pool.slice(0,n);
      const total=Object.values(onb.seeded).reduce((a,b)=>a+b,0);
      const addBtn=`<div class="onb-add ${n>=pool.length?"spent":""}" id="onbAdd"><span class="pl">+</span><span>Add an activity</span></div>`;
      let h=total===0
        ? `<div class="onb-lead">Start out by adding any activities you have confirmed.</div>
           <div class="onb-sub">You can always edit them later.</div>${addBtn}`
        : `<div class="onb-lead">Keep adding activities to ${PARTY.name}</div><div class="onb-sub">&nbsp;</div>${addBtn}`;
      if(total>0){
        h+=`<div class="onb-days" id="onbDays">${DAYS.map(d=>`<div class="onb-day ${d.n===day?"on":""}" data-day="${d.n}"><span class="n num">${d.n}</span><span class="l">${d.label}</span></div>`).join("")}</div>`;
        h+=shown.length
          ? shown.map(e=>`<div class="onb-ev"><div class="t">${e.name}</div><div class="m num">${fmtTime(e.start)} · at ${e.loc}</div></div>`).join("")
          : `<div class="onb-none">Nothing on this day yet.</div>`;
      }
      return onbShell(h,onbCta("Next"));
    }

    case"links":{
      const links=onbLinks();
      const only=links.length===1?`<div class="onb-note" style="margin-bottom:18px">You're planning solo and you're the bride, so one link covers everyone.</div>`:"";
      return onbShell(`<div class="onb-lead" style="margin-bottom:22px">Ready to add everyone to the group!</div>${only}
        ${links.map(l=>`<div class="onb-linkrow"><div class="k">${l.k}</div>
          <div class="onb-linkbox"><span class="u">${l.u}</span><span class="onb-copy ${onb.copied[l.id]?"done":""}" data-copy="${l.id}" data-u="${l.u}">${onb.copied[l.id]?"Copied":"Copy"}</span></div>
          ${l.note?`<div class="onb-note">${l.note}</div>`:""}</div>`).join("")}`,
        onbCta("All done"));
    }
  }
}

function bindOnb(){
  const s=onbStep();
  document.getElementById("onbCta")?.addEventListener("click",onbNext);

  // tap-to-fill on any field this step declares
  document.querySelectorAll("[data-fill]").forEach(el=>el.addEventListener("click",()=>{
    const k=el.dataset.fill;
    onb.filled[k]=onb.filled[k]?null:(el.dataset.sample||true);
    render();}));
  document.getElementById("onbDp")?.addEventListener("click",e=>{
    const c=e.target.closest(".onb-dp-cell[data-d]");if(!c)return;onbDateTap(+c.dataset.d);});

  // let the CTA swoop in the first time the step is satisfied, then sit still
  const foot=document.querySelector(".onb-foot");
  if(foot&&onbReady()){
    if(onb.footUp)foot.classList.add("up");
    else{onb.footUp=true;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector(".onb-foot")?.classList.add("up")));}
  }
  if(s==="splash"){
    const seq=onb.i;
    document.getElementById("onbSplash").addEventListener("click",onbNext);
    setTimeout(()=>{if(onb&&onb.i===seq&&currentView==="onb")onbNext();},1500);
  }
  if(s==="roles"){
    document.querySelectorAll(".onb-pills[data-q]").forEach(g=>g.addEventListener("click",e=>{
      const p=e.target.closest(".onb-pill");if(!p)return;onbSetQ(g.dataset.q,p.dataset.v);}));
  }
  if(s==="details"){
    document.querySelectorAll(".onb-theme[data-theme]").forEach(c=>c.addEventListener("click",()=>{onb.theme=c.dataset.theme;render();}));
  }
  if(s==="seed"){
    document.getElementById("onbAdd").addEventListener("click",()=>{
      const pool=EVENTS.filter(e=>e.day===onb.day),n=onb.seeded[onb.day]||0;
      if(n>=pool.length)return;
      onb.seeded[onb.day]=n+1;render();});
    document.getElementById("onbDays")?.addEventListener("click",e=>{
      const d=e.target.closest(".onb-day");if(!d)return;onb.day=+d.dataset.day;render();});
  }
  if(s==="links"){
    document.querySelectorAll(".onb-copy[data-copy]").forEach(b=>b.addEventListener("click",()=>{
      try{navigator.clipboard?.writeText("https://"+b.dataset.u);}catch(err){}
      onb.copied[b.dataset.copy]=true;render();}));
  }
}

const ONB_CAPTIONS={
  splash:"<b>ONBOARDING</b> · neutral by design — no theme exists until the creator picks one.",
  invite:"<b>ONBOARDING</b> · the invite link carries the permission level, so the landing copy changes per role.",
  phone:"<b>ONBOARDING</b> · tap a field to fill it — the button swoops up once the step is satisfied.",
  profile:"<b>ONBOARDING</b> · only the name is required. The payment handles are what settle-up displays later.",
  name:"<b>ONBOARDING</b> · only the creator goes past the account block.",
  dates:"<b>ONBOARDING</b> · tap a start day, then a later one. The chosen range becomes the itinerary's day chips.",
  roles:"<b>ONBOARDING</b> · questions appear only when they can change the answer. Try each combination.",
  details:"<b>ONBOARDING</b> · the theme is a property of the weekend, set once, inherited by everyone.",
  seed:"<b>ONBOARDING</b> · land on the days and add whatever is already confirmed.",
  links:"<b>ONBOARDING</b> · the link set is derived from the role answers — nothing you don't need."
};

/* ========== MASTER RENDER ========== */
const SCROLLERS=".form-scroll,.list-scroll,.acct-scroll,.timeline-scroll,.detail-scroll";
let lastView=null;
function render(){
  document.documentElement.className="theme-"+THEMES[currentTheme].cls;
  // onboarding predates the party, so the role switcher and the tab bar are meaningless there
  const isOnb=currentView==="onb";
  document.getElementById("roleToggle").style.display=isOnb?"none":"";
  document.getElementById("navBar").style.display=isOnb?"none":"";
  document.querySelectorAll("#roleToggle button").forEach(b=>b.classList.toggle("on",b.dataset.role===currentRole));
  document.getElementById("roleCaption").innerHTML=isOnb?(ONB_CAPTIONS[onbStep()]||""):getCaption();
  renderNav();
  const root=document.getElementById("viewRoot");
  // keep the scroll position when re-rendering the same view in place
  const prev=root.querySelector(SCROLLERS),keepScroll=lastView===currentView?(prev?prev.scrollTop:0):0;
  switch(currentView){
    case"home":root.innerHTML=renderHome();bindHome();break;
    case"home-add":root.innerHTML=renderAddActivity();bindAddActivity();break;
    case"home-view":root.innerHTML=renderViewActivity();bindViewActivity();break;
    case"expenses":root.innerHTML=renderExpenses();bindExpenses();break;
    case"expenses-settle":root.innerHTML=renderSettle();bindSettle();break;
    case"expenses-add":root.innerHTML=renderAddExpense();bindAddExpense();break;
    case"expenses-close":root.innerHTML=renderCloseOut();bindCloseOut();break;
    case"expenses-view":root.innerHTML=renderViewExpense();bindViewExpense();break;
    case"messages":root.innerHTML=renderMessages();bindMessages();break;
    case"messages-add":root.innerHTML=renderAddGroup();bindAddGroup();break;
    case"messages-thread":root.innerHTML=renderThread(openBoard);bindThread();break;
    case"account":root.innerHTML=renderAccount();bindAccount();break;
    case"onb":root.innerHTML=renderOnb();bindOnb();break;
  }
  if(keepScroll){const now=root.querySelector(SCROLLERS);if(now)now.scrollTop=keepScroll;}
  lastView=currentView;
  // only planners make groups, so switching out of that role drops you back to the list
  if(currentView==="messages-add"&&currentRole!=="planner"){currentView="messages";render();return;}
  // if switching role while in a board the role can't see, bounce to list
  if(currentView==="messages-thread"&&openBoard&&openBoard!=="announcements"){const b=BOARDS.find(x=>x.id===openBoard);if(b&&!canSeeBoard(b,currentRole)){currentView="messages";openBoard=null;render();}}
}
document.querySelectorAll("#roleToggle button").forEach(b=>b.addEventListener("click",()=>{currentRole=b.dataset.role;render();}));
render();

</script>
