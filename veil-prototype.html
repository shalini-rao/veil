<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&family=Fredoka:wght@400;600&family=Poppins:wght@400;600&family=EB+Garamond:wght@400;600&family=Jost:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ========== TOKENS ==========
   Mirrors the Figma architecture: Primitives has one mode per theme, Semantic
   is single-mode aliases. Swapping a theme swaps the primitive layer only —
   no component ever names a raw value. Because custom properties resolve where
   they are declared, the semantic block is re-declared on every element that
   supplies primitives (:root for the party theme, .onb for neutral). */

/* ---- primitives ---- */
.theme-desert-warmth{
  --sand-50:#f5ede2;--cream-50:#fffbf5;--espresso-900:#2e2822;--taupe-500:#7a6f63;
  --terracotta-500:#c4714b;--sand-200:#e8d5c4;--sage-500:#7b9370;--amber-400:#d9a566;
  --clay-600:#8c3a3f;--button-text-base:#fffefb;--neutral-disabled:#e7e1d8;--border-hairline:#ebdfcf;
  --radius-sm:8px;--radius-md:12px;--radius-lg:20px;
  --font-family-display:'Cormorant Garamond',serif;--font-family-body:'DM Sans',sans-serif;
  --weight-display:600;--weight-title:600;
}
.theme-playful-pop{
  --sand-50:#fdf3f8;--cream-50:#ffffff;--espresso-900:#2b2733;--taupe-500:#8a7f93;
  --terracotta-500:#f5617a;--sand-200:#f7d9e4;--sage-500:#8bb89a;--amber-400:#e0a5c6;
  --clay-600:#c24a6e;--button-text-base:#fffefb;--neutral-disabled:#ece7ef;--border-hairline:#f0e2ec;
  --radius-sm:12px;--radius-md:16px;--radius-lg:24px;
  --font-family-display:'Fredoka',sans-serif;--font-family-body:'Poppins',sans-serif;
  --weight-display:400;--weight-title:400;
}
.theme-ivory-veil{
  --sand-50:#fbf9f5;--cream-50:#ffffff;--espresso-900:#3a3630;--taupe-500:#756b60;
  --terracotta-500:#c7a96b;--sand-200:#efe7d6;--sage-500:#8fa394;--amber-400:#c9a9a0;
  --clay-600:#8a5a6b;--button-text-base:#3a3630;--neutral-disabled:#ede9e2;--border-hairline:#efe9e0;
  --radius-sm:9px;--radius-md:14px;--radius-lg:22px;
  --font-family-display:'EB Garamond',serif;--font-family-body:'Jost',sans-serif;
  --weight-display:400;--weight-title:600;
}
.theme-neutral{
  --sand-50:#f7f6f4;--cream-50:#ffffff;--espresso-900:#1f1d1b;--taupe-500:#6b6660;
  --terracotta-500:#2e2a26;--sand-200:#cccccc;--sage-500:#8fa394;--amber-400:#c9a9a0;
  --clay-600:#8a5a6b;--button-text-base:#ffffff;--neutral-disabled:#ede9e2;--border-hairline:#efe9e0;
  --radius-sm:9px;--radius-md:14px;--radius-lg:22px;
  --font-family-display:'Inter',sans-serif;--font-family-body:'Inter',sans-serif;
  --weight-display:600;--weight-title:600;
}

/* ---- semantic layer ---- */
:root,.onb{
  --surface-page:var(--sand-50);
  --surface-card:var(--cream-50);
  --surface-disabled:var(--neutral-disabled);
  --ink-primary:var(--espresso-900);
  --ink-secondary:var(--taupe-500);
  --ink-on-accent:var(--button-text-base);
  --accent:var(--terracotta-500);
  --accent-quiet:var(--sand-200);
  --border-subtle:var(--border-hairline);
  --visibility-everyone:var(--sage-500);
  --visibility-teased:var(--amber-400);
  --visibility-hidden:var(--clay-600);
  /* icon colour on a visibility-hidden badge — see the Ivory Veil override below */
  --ink-on-hidden:var(--button-text-base);
  --radius-chip:var(--radius-sm);
  --radius-card:var(--radius-md);
  --radius-sheet:var(--radius-lg);
  --font-display:var(--font-family-display);
  --font-body:var(--font-family-body);
  /* past events dim toward the page behind them */
  --past-edge:color-mix(in srgb,var(--taupe-500) 42%,var(--sand-50));
  /* type scale — sizes are shared across the three party themes so a theme
     swap never reflows a layout. Only family and weight move. Figma states
     tracking as a percentage of the size, so it converts straight to em. */
  --font-size-display:44px;--line-height-display:48px;--tracking-display:-.005em;
  --font-size-title:22px; --line-height-title:28px; --tracking-title:0;
  --font-size-body:16px;  --line-height-body:24px;  --tracking-body:0;
  --font-size-caption:13px;--line-height-caption:18px;--tracking-caption:.001em;
  --font-size-label:12px; --line-height-label:16px; --tracking-label:.006em;
}
/* Ivory Veil's button text is dark, which disappears on the hidden-visibility
   badge. Its icon rides accent-quiet instead. Must follow the semantic block. */
.theme-ivory-veil{--ink-on-hidden:var(--sand-200)}
/* Neutral's display runs smaller and untracked */
.theme-neutral{--font-size-display:40px;--line-height-display:44px;--tracking-display:0}

/* ---- never themed ---- */
:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
  --color-off-white:#fffefb;
  --elevation:2px 4px 6px rgba(0,0,0,0.15);
}
/* ---- type styles ---- */
.type-display{font-family:var(--font-display);font-weight:var(--weight-display);font-size:var(--font-size-display);line-height:var(--line-height-display);letter-spacing:var(--tracking-display)}
.type-title{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.type-body{font-family:var(--font-body);font-weight:400;font-size:var(--font-size-body);line-height:var(--line-height-body);letter-spacing:var(--tracking-body)}
.type-caption{font-family:var(--font-body);font-weight:400;font-size:var(--font-size-caption);line-height:var(--line-height-caption);letter-spacing:var(--tracking-caption)}
.type-label{font-family:var(--font-body);font-weight:600;font-size:var(--font-size-label);line-height:var(--line-height-label);letter-spacing:var(--tracking-label);text-transform:uppercase}

*{box-sizing:border-box;margin:0;padding:0}
body{background:#dcd8de;display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 20px 60px;font-family:var(--font-body)}
.num{font-feature-settings:"lnum"1,"tnum"1}

/* role toggle */
.role-toggle{display:flex;gap:6px;background:#fff;padding:6px;border-radius:12px;box-shadow:0 4px 16px rgba(60,40,60,.15)}
.role-toggle button{border:none;background:transparent;font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 18px;border-radius:8px;color:#8a7f78;cursor:pointer;transition:all .15s}
.role-toggle button.on{background:var(--accent);color:#fff}
.role-caption{font-size:12px;color:#6b6470;text-align:center;max-width:393px;line-height:1.45;min-height:34px}
.role-caption b{color:#2E2822}

/* screen shell */
.screen{width:393px;height:852px;background:var(--surface-page);border-radius:34px;box-shadow:0 16px 50px rgba(60,40,60,.18);position:relative;overflow:hidden;color:var(--ink-primary);display:flex;flex-direction:column}

/* On a real phone the decorative frame gets in the way: drop the desktop
   chrome, fill the viewport, and let the in-app role switcher in Account
   stand in for the toggle that sits above the frame on a computer. */
@media (max-width:520px){
  body{padding:0;gap:0;background:var(--surface-page);min-height:100dvh}
  .role-toggle,.role-caption{display:none}
  .screen{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .form-head,.settle-head{padding-top:max(28px,env(safe-area-inset-top))}
  .top-fixed{padding-top:max(28px,env(safe-area-inset-top))}
  .nav{height:auto;min-height:80px;padding-bottom:calc(var(--space-4) + env(safe-area-inset-bottom))}
}
#viewRoot{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* nav */
.nav{flex-shrink:0;width:100%;height:80px;background:var(--surface-card);display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-4) var(--space-6);border-top:1px solid var(--border-subtle)}
.nav-item{width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-secondary);cursor:pointer}
.nav-item.on{color:var(--accent)}
.nav-ico svg{display:block;width:24px;height:24px}
.nlbl{font-weight:600;font-size:var(--font-size-label);line-height:var(--line-height-label);letter-spacing:var(--tracking-label);text-transform:uppercase}

/* shared */
.top-fixed{flex-shrink:0;width:100%;padding:70px var(--space-5) var(--space-5);display:flex;flex-direction:column;align-items:center;gap:var(--space-5)}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.header{width:100%;display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.home-actions{display:flex;flex-direction:column;gap:var(--space-2);width:100%}
.coming-up{width:100%;background:var(--surface-card);border-radius:var(--radius-card);padding:var(--space-3) 28px;display:flex;align-items:center;justify-content:center;gap:var(--space-4);box-shadow:0 2px 10px rgba(60,40,60,.05);cursor:pointer}
.cu-label{font-size:16px;line-height:20px;color:var(--ink-secondary);flex-shrink:0}
.cu-body{display:flex;flex-direction:column;flex:1;min-width:0}
.cu-name{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title);color:var(--ink-primary);display:flex;align-items:center;gap:var(--space-2);min-width:0}
.cu-name .cu-lock{width:14px;height:14px;color:var(--visibility-hidden);flex-shrink:0}
.cu-name .cu-lock svg{width:100%;height:100%}
.cu-meta{font-size:var(--font-size-caption);line-height:var(--line-height-caption);letter-spacing:var(--tracking-caption);color:var(--ink-secondary)}
.coming-up.quiet .cu-name{font-size:18px;color:var(--ink-secondary)}
.btn-full{width:100%;justify-content:center}
.top-fixed.home-top{gap:var(--space-4);padding-bottom:0}
/* every page but home titles at the title scale; home keeps the display scale */
.page-title{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.btn{display:inline-flex;align-items:center;gap:var(--space-1);height:40px;padding:0 20px;border-radius:var(--radius-sm);cursor:pointer}
.btn-primary{background:var(--accent);color:var(--ink-on-accent)}
/* outline variant, and the short size both variants come in */
.btn-line{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-sm{height:32px;min-height:32px;padding:0 var(--space-2)}
.btn .ic svg{display:block;width:16px;height:16px}
.btn-label{font-weight:600;font-size:var(--font-size-label);letter-spacing:var(--tracking-label);text-transform:uppercase;padding:var(--space-1);white-space:nowrap}
.back-ic{cursor:pointer}.back-ic svg{display:block;width:24px;height:24px}

/* chips + toggles */
.seg{display:flex;gap:var(--space-3)}
.chip{height:40px;padding:0 var(--space-4);border-radius:20px;border:1px solid var(--accent);display:flex;align-items:center;font-weight:600;font-size:var(--font-size-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-primary);background:transparent;cursor:pointer;transition:all .15s}
.chip.on{background:var(--accent);color:var(--ink-on-accent)}
.seg.static .chip{cursor:default}
.day-chip{width:60px;height:60px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent-quiet);color:var(--ink-primary);cursor:pointer;transition:all .15s}
.day-chip.on{background:var(--accent);color:var(--ink-on-accent)}
.day-chip .dnum{font-family:var(--font-display);font-weight:var(--weight-display);font-size:28px;line-height:28px}
.day-chip .dlbl{font-weight:600;font-size:var(--font-size-label);line-height:var(--line-height-label);letter-spacing:var(--tracking-label);text-transform:uppercase;margin-top:1px}

/* form fields */
.form-head{flex-shrink:0;display:flex;align-items:center;gap:var(--space-3);padding:66px var(--space-5) var(--space-4)}
.form-title{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.form-scroll{flex:1;overflow-y:auto;padding:0 var(--space-5) 40px;display:flex;flex-direction:column;gap:20px}
.form-scroll>*{flex-shrink:0}
.form-scroll::-webkit-scrollbar{width:0}
.input{width:100%;min-height:42px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-card);padding:9px var(--space-4);display:flex;align-items:center;justify-content:flex-start;font-size:var(--font-size-body);line-height:var(--line-height-body);color:var(--ink-secondary)}
.input.select{justify-content:space-between}
/* the group-name field is a real input, since the name it takes ends up on the board */
input.input{font-family:inherit;font-size:var(--font-size-body);line-height:var(--line-height-body);color:var(--ink-primary);outline:none;-webkit-appearance:none}
input.input::placeholder{color:var(--ink-secondary)}
.input.filled,.textarea.filled{color:var(--ink-primary)}
.close-line{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle)}
.close-line:last-of-type{border-bottom:none}
.close-left{display:flex;flex-direction:column;gap:2px}
.close-name{font-size:16px;line-height:22px;color:var(--ink-primary)}
.close-meta{font-size:13px;color:var(--ink-secondary)}
.close-amt{font-size:16px;white-space:nowrap}
.close-total{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--ink-secondary)}
.close-total .lbl{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.close-total .amt{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title);color:var(--accent)}
.closed-note{display:flex;align-items:center;gap:10px;border:1px solid var(--visibility-everyone);background:color-mix(in srgb,var(--visibility-everyone) 10%,transparent);border-radius:var(--radius-card);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5)}
.closed-note svg{width:18px;height:18px;color:var(--visibility-everyone);flex-shrink:0}
.closed-note-text{font-size:13px;line-height:1.4;color:var(--visibility-everyone)}
.input .chev svg{display:block;width:24px;height:24px;color:var(--ink-secondary)}
.field-label{font-size:16px;color:var(--ink-primary)}
.section-label{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.detail-scroll{flex:1;overflow-y:auto;padding:0 var(--space-5) 40px;display:flex;flex-direction:column;gap:var(--space-5)}
.detail-scroll>*{flex-shrink:0}
.detail-name{font-family:var(--font-display);font-weight:var(--weight-display);font-size:36px;line-height:40px;letter-spacing:-.5px;display:flex;align-items:flex-start;gap:var(--space-3)}
.detail-when{font-size:16px;line-height:22px;color:var(--accent);font-weight:600;margin-top:calc(var(--space-5) * -1 + var(--space-2))}
.d-block{display:flex;flex-direction:column;gap:var(--space-2)}
.d-body{font-size:var(--font-size-body);line-height:var(--line-height-body);color:var(--ink-secondary)}
.d-body.muted{font-style:italic;opacity:.7}
.detail-name .lock{flex-shrink:0;width:22px;height:22px;margin-top:9px;color:var(--visibility-hidden)}
.detail-name .lock svg{width:100%;height:100%}
.group{display:flex;flex-direction:column;gap:var(--space-3)}
.textarea{width:100%;min-height:100px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-card);padding:9px var(--space-4);font-size:16px;color:var(--ink-secondary)}

.checkbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .15s}
.checkbox.on{background:var(--accent)}.checkbox.off{background:var(--surface-card)}
.checkbox svg{width:15px;height:15px;color:var(--ink-on-accent)}

.divider-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink-secondary);padding-bottom:var(--space-2);cursor:pointer}
.divider-row .chev svg{display:block;width:24px;height:24px;color:var(--ink-secondary);transition:transform .2s}
.divider-row .chev.open svg{transform:rotate(180deg)}
.split-list{display:flex;flex-direction:column;gap:var(--space-3);overflow:hidden;transition:max-height .25s,opacity .2s}
.split-list.collapsed{max-height:0;opacity:0}.split-list.expanded{max-height:800px;opacity:1}
.hide-wrap.hidden{display:none}
.split-row{display:flex;align-items:center;justify-content:space-between;min-height:42px}
.split-left{display:flex;align-items:center;gap:var(--space-3)}
.amount-input{width:100px;min-height:42px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);background:var(--surface-card);padding:9px var(--space-3);display:flex;align-items:center;gap:var(--space-1);font-size:16px;color:var(--ink-secondary)}

.hide-wrap{display:flex;align-items:center;gap:var(--space-2);cursor:pointer;flex-shrink:0}
.hide-label{font-size:13px;color:var(--ink-secondary)}
.toggle{width:44px;height:26px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.off{background:var(--accent-quiet)}.toggle.on{background:var(--accent)}
.toggle .knob{position:absolute;top:2px;width:22px;height:22px;border-radius:50%;background:var(--surface-card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle.off .knob{left:2px}.toggle.on .knob{left:20px}

.bride-split{display:flex;flex-direction:column;gap:6px}
.bride-top{display:flex;align-items:center;justify-content:space-between}
.bride-bottom{display:flex;align-items:center;justify-content:flex-end}
.bride-bottom.hidden{display:none}

.bride-pays{display:flex;align-items:center;gap:var(--space-3);cursor:pointer;transition:opacity .2s}
.bride-pays.bphidden{opacity:0;height:0;overflow:hidden;margin:0;padding:0;pointer-events:none}

.vis-picker{display:flex;gap:var(--space-2)}
.vis-opt{height:40px;padding:0 var(--space-3);border-radius:20px;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:var(--font-size-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-primary);background:transparent;flex:1;cursor:pointer;transition:all .15s}
.vis-opt.on{background:var(--accent);color:var(--ink-on-accent)}

.btn-outline{width:100%;min-height:40px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:transparent;display:flex;align-items:center;justify-content:center;gap:var(--space-1);color:var(--accent)}
.btn-outline .ic svg{display:block;width:16px;height:16px}
/* the home "add activity" button is the short 32px outline variant, not the 40px form one */
.btn-add-activity{height:32px;min-height:32px;gap:var(--space-2);max-width:361px}
/* before the trip the button sits in the header, on the day selector's inset */
.add-row{width:100%;display:flex;padding:0 var(--space-4)}
.btn-save{width:100%;min-height:40px;border-radius:var(--radius-sm);background:var(--accent);color:var(--ink-on-accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-save.off{opacity:.4;cursor:default}
/* you're always in a group you made, so your own row reads but doesn't respond */
.split-row .checkbox.locked{cursor:default}

/* --- HOME timeline --- */
.countdown{display:flex;align-items:center;justify-content:center;gap:var(--space-1);font-family:var(--font-display);font-weight:var(--weight-display)}
.countdown .word{font-size:22px;color:var(--ink-secondary)}.countdown .days{font-size:44px;letter-spacing:-.5px;color:var(--accent)}
.header-title-wrap{width:100%;border-bottom:1px solid var(--border-subtle);padding:var(--space-2) 0}
.header-title{font-family:var(--font-display);font-weight:var(--weight-display);font-size:var(--font-size-display);line-height:var(--line-height-display);letter-spacing:var(--tracking-display)}
.header-loc{font-size:var(--font-size-caption);line-height:var(--line-height-caption);letter-spacing:var(--tracking-caption);color:var(--ink-secondary)}
.date-selector{display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-4);width:100%}
/* space-4 clears the day chips, the extra 8px is the grid's own inset above the first hour line */
.timeline-scroll{flex:1;overflow-y:auto;padding:calc(var(--space-4) + 8px) var(--space-5) 40px;margin-top:0}
.timeline-scroll::-webkit-scrollbar{width:0}
.timegrid{position:relative;width:100%}
.hour-row{position:absolute;left:0;width:100%;height:0}
.hour-tick{position:absolute;left:0;top:-8px;width:34px;text-align:right;font-weight:600;font-size:var(--font-size-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-secondary)}
.hour-line{position:absolute;left:42px;right:0;top:0;border-top:1px solid var(--border-subtle)}
.events-layer{position:absolute;left:42px;right:0;top:0;bottom:0}
.ac{position:absolute;left:6px;right:0;cursor:pointer;background:var(--surface-card);border-left:2px solid var(--visibility-everyone);border-right:2px solid var(--visibility-everyone);border-radius:var(--radius-card);padding:0 var(--space-3);overflow:hidden}
.ac .inner{height:100%;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);padding:8px 0;display:flex;flex-direction:column}
.ac .aname{font-weight:400;font-size:var(--font-size-body);line-height:var(--line-height-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .ameta{font-weight:400;font-size:var(--font-size-caption);line-height:var(--line-height-caption);letter-spacing:var(--tracking-caption);color:var(--ink-secondary);margin-top:2px}
.ac.half{border-left-color:var(--visibility-teased);border-right-color:var(--visibility-teased)}
.ac.teased{border-left-color:var(--visibility-teased);border-right-color:var(--visibility-teased);background:color-mix(in srgb,var(--visibility-teased) 10%,var(--surface-card))}
.ac.teased .inner{border:none;justify-content:center}.ac.teased .aname{color:var(--visibility-teased)}
.ac.secret{border:1px dashed var(--visibility-hidden)}.ac.secret .inner{border:none}
/* Already happened. Per the design system's `past` variant: the card fills in
   rather than fading out, and the name keeps full contrast — it's settled, not
   diminished. Borders are neutral so the visibility colors read as live-only. */
.ac.past{background:var(--surface-disabled);box-shadow:none;border:none;border-left:2px solid var(--past-edge);border-right:2px solid var(--past-edge)}
.ac.past .inner{border-top:none;border-bottom:none}
.ac.past .aname{color:var(--ink-primary)}
.ac.past .ameta{color:var(--ink-secondary)}
.ac .badge,.ac .secret-badge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:10px;background:var(--visibility-hidden);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ac .badge svg,.ac .secret-badge svg{width:12px;height:12px;color:var(--ink-on-hidden)}

/* --- EXPENSES --- */
.total-card{width:100%;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:26px 23px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.total-left{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.owe-label{font-weight:600;font-size:var(--font-size-label);line-height:var(--line-height-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-secondary)}
.owe-amount{font-family:var(--font-display);font-weight:var(--weight-display);font-size:var(--font-size-display);line-height:var(--line-height-display);letter-spacing:var(--tracking-display)}
.exp-scroll{flex:1;width:100%;overflow-y:auto;padding:4px var(--space-5) 40px}
.exp-scroll::-webkit-scrollbar{width:0}
.exp-list{display:flex;flex-direction:column;gap:var(--space-4);width:100%}
.sect-label{font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-secondary);margin:var(--space-2) 2px -4px}
.exp-card{position:relative;width:100%;cursor:pointer;filter:drop-shadow(var(--elevation))}
.exp-inner{width:100%;min-height:72px;display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-3) var(--space-5) var(--space-2);border-radius:var(--radius-card);background:var(--surface-card);overflow:hidden}
.exp-card.pending{filter:none}.exp-card.pending .exp-inner{background:transparent;border:1px dashed var(--ink-secondary)}
.exp-row{display:flex;align-items:center;justify-content:space-between;width:100%}
.exp-name{font-weight:400;font-size:var(--font-size-body);line-height:var(--line-height-body)}
.exp-amount{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.exp-date,.exp-total{font-weight:400;font-size:var(--font-size-caption);line-height:var(--line-height-caption);letter-spacing:var(--tracking-caption);color:var(--ink-secondary)}
.exp-sub{font-size:12px;color:var(--ink-secondary);margin-top:2px}
.badge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:2}
.badge.pin{background:var(--accent)}.badge.secret{background:var(--visibility-hidden)}
.badge svg{width:12px;height:12px;color:var(--ink-on-accent)}
.badge.secret svg{color:var(--ink-on-hidden)}

/* settle */
.settle-head{flex-shrink:0;display:flex;align-items:center;gap:var(--space-3);padding:66px var(--space-5) var(--space-4)}
.head-title{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.settle-body{flex:1;overflow-y:auto;padding:0 var(--space-5) 40px}.settle-body::-webkit-scrollbar{width:0}
.warn{border:1px solid var(--visibility-hidden);background:color-mix(in srgb,var(--visibility-hidden) 7%,transparent);border-radius:var(--radius-card);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5);display:flex;align-items:center;gap:10px}
.warn svg{width:18px;height:18px;color:var(--visibility-hidden);flex-shrink:0}
.warn-text{font-size:13px;line-height:1.4;color:var(--visibility-hidden)}
.owe-line{font-family:var(--font-display);font-weight:var(--weight-display);font-size:26px;margin-bottom:var(--space-2)}.owe-line .amt{color:var(--accent)}
.send-to{font-weight:600;font-size:15px;color:var(--ink-secondary);margin:var(--space-5) 0 var(--space-3)}.send-to .amt{color:var(--ink-primary);font-size:18px}
.pay-card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:var(--space-4);display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-3)}
.pc-av{width:52px;height:52px;border-radius:50%;flex-shrink:0;object-fit:cover}
.pc-name{font-family:var(--font-display);font-weight:var(--weight-title);font-size:20px;line-height:1.1}
.pc-handle{font-size:12px;color:var(--ink-secondary);margin-top:3px;display:flex;gap:var(--space-1)}.pc-handle .lbl{font-weight:600}
.done-btn{width:100%;min-height:48px;border-radius:var(--radius-sm);background:var(--accent);color:var(--ink-on-accent);display:flex;align-items:center;justify-content:center;margin-top:var(--space-5);font-weight:600;font-size:14px;letter-spacing:.4px;cursor:pointer}

/* --- MESSAGES --- */
.list-scroll{flex:1;width:100%;overflow-y:auto;padding:4px var(--space-5) 40px}.list-scroll::-webkit-scrollbar{width:0}
.board-list{display:flex;flex-direction:column;gap:var(--space-4);width:100%}
.board{position:relative;width:100%;filter:drop-shadow(var(--elevation));cursor:pointer}
.board-inner{display:flex;flex-direction:column;gap:var(--space-1);height:72px;padding:var(--space-3) 20px var(--space-2);border-radius:var(--radius-card);background:var(--surface-card);border:1px solid var(--visibility-everyone);overflow:hidden}
.board.announce .board-inner{border-color:var(--accent)}
.board.plusbride .board-inner{border-color:var(--visibility-everyone)}
.board.nobride .board-inner{border:1px dashed var(--visibility-hidden)}
.board.read .board-inner{background:var(--surface-disabled)}
.board-name{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-prev{display:flex;gap:var(--space-1);align-items:center;width:100%;overflow:hidden}
.prev-sender{font-size:13px;white-space:nowrap}.prev-text{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.thread-head{flex-shrink:0;display:flex;align-items:center;gap:var(--space-3);padding:66px var(--space-5) var(--space-4);border-bottom:1px solid var(--border-subtle);background:var(--surface-card)}
.thread-title{font-family:var(--font-display);font-weight:var(--weight-title);font-size:var(--font-size-title);line-height:var(--line-height-title);letter-spacing:var(--tracking-title)}
.nobride-tag{font-size:12px;color:var(--ink-secondary);font-weight:600}
.thread-sub{font-size:12px;color:var(--ink-secondary)}
.thread{flex:1;overflow-y:auto;padding:var(--space-5) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}.thread::-webkit-scrollbar{width:0}
.divider{text-align:center;font-size:11px;color:var(--ink-secondary);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:var(--space-2) 0}
.row{display:flex;align-items:flex-end;gap:var(--space-2);max-width:88%}
.row.right{align-self:flex-end;flex-direction:row-reverse}.row.left{align-self:flex-start}
.avatar{width:28px;height:28px;border-radius:20px;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.mc{position:relative;display:flex;flex-direction:column;gap:var(--space-1);max-width:274px;width:236px;padding:10px var(--space-3);border-radius:var(--radius-card);overflow:visible}
.mc .body-text{font-size:var(--font-size-caption);line-height:var(--line-height-caption);letter-spacing:var(--tracking-caption)}
.mc .time{font-size:11px;line-height:16px;letter-spacing:.066em;text-transform:uppercase;text-align:right;width:100%}
.mc .ann-label{font-weight:600;font-size:var(--font-size-label);letter-spacing:var(--tracking-label);text-transform:uppercase}
.mc .sender{font-weight:600;font-size:var(--font-size-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:#000}
.mc.self{background:var(--accent)}.mc.self .body-text,.mc.self .time{color:var(--ink-on-accent)}
.mc.other{background:var(--surface-card);border:1px solid var(--border-subtle)}.mc.other .body-text{color:var(--ink-primary)}.mc.other .time{color:var(--ink-secondary)}
.mc.ann-self{background:var(--accent)}.mc.ann-self .ann-label,.mc.ann-self .body-text,.mc.ann-self .time{color:var(--ink-on-accent)}
.mc.ann-other{background:var(--accent-quiet);border:1px solid var(--accent)}.mc.ann-other .ann-label{color:var(--accent)}.mc.ann-other .body-text,.mc.ann-other .time{color:var(--ink-primary)}
.mc.ann-secret{background:var(--accent-quiet);border:1px dashed var(--accent)}.mc.ann-secret .ann-label{color:var(--accent)}.mc.ann-secret .body-text,.mc.ann-secret .time{color:var(--ink-primary)}
.mc .secret-badge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:10px;background:var(--visibility-hidden);display:flex;align-items:center;justify-content:center;overflow:hidden}.mc .secret-badge svg{width:12px;height:12px;color:var(--ink-on-hidden)}
.ann-source{font-size:10px;color:var(--ink-secondary);letter-spacing:.04em;margin-bottom:2px}
.composer{flex-shrink:0;border-top:1px solid var(--border-subtle);background:var(--surface-card);padding:var(--space-3) var(--space-4) var(--space-5)}
.compose-toggle{display:flex;align-items:center;gap:var(--space-2);margin-bottom:10px;font-size:12px;color:var(--ink-secondary);cursor:pointer}
.cbox{width:20px;height:20px;border-radius:5px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbox.on{background:var(--accent)}.cbox.off{background:var(--surface-card)}
.cbox svg{width:13px;height:13px;color:var(--ink-on-accent)}
.ct-b{color:var(--ink-primary);font-weight:600}
.secret-note{color:var(--visibility-hidden);font-weight:600}
.compose-row{display:flex;align-items:center;gap:var(--space-3)}
.cinput{flex:1;min-height:44px;border-radius:22px;background:var(--surface-page);border:1px solid var(--border-subtle);padding:0 16px;display:flex;align-items:center;font-size:14px;color:var(--ink-secondary)}
.send{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--accent);color:var(--ink-on-accent);display:flex;align-items:center;justify-content:center}.send svg{width:20px;height:20px}

/* --- ACCOUNT --- */
.acct-scroll{flex:1;overflow-y:auto;padding:70px var(--space-5) 40px}.acct-scroll::-webkit-scrollbar{width:0}
.profile{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-6)}
.prof-av{width:76px;height:76px;border-radius:50%;flex-shrink:0;object-fit:cover}
.p-name{font-family:var(--font-display);font-weight:var(--weight-display);font-size:26px;line-height:1.1}
.p-phone{font-size:13px;color:var(--ink-secondary);margin-top:2px}
.group-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-secondary);margin:0 2px 10px}
.acct-field{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.acct-field .k{font-size:12px;color:var(--ink-secondary)}.acct-field .v{font-size:15px;font-weight:500;margin-top:2px}
.acct-field .v.empty{color:var(--ink-secondary);font-style:italic;font-weight:400}
.acct-field .chev svg,.acct-row .chev svg{display:block;width:18px;height:18px;color:var(--ink-secondary)}
.acct-row{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:13px}
.acct-row .a-ic svg{display:block;width:22px;height:22px;color:var(--accent)}
.acct-row .rl{flex:1;font-size:15px;font-weight:500}
.demo{margin-top:var(--space-5);border:1.5px dashed var(--accent);border-radius:var(--radius-card);padding:15px;background:color-mix(in srgb,var(--accent) 5%,transparent)}
.demo-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.demo-seg{display:flex;gap:var(--space-2)}
.demo-seg .opt{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:13px;font-weight:600;background:var(--surface-card);color:var(--ink-secondary);border:1px solid var(--border-subtle);cursor:pointer}
.demo-seg .opt.on{background:var(--accent);color:var(--ink-on-accent);border-color:var(--accent)}
.demo-seg.four .opt,.demo-seg.tight .opt{font-size:11px;padding:0 2px;text-align:center;line-height:1.2}
.demo-hint{font-size:11px;line-height:1.45;color:var(--ink-secondary);margin-top:9px}
.empty-msg{text-align:center;color:var(--ink-secondary);font-size:15px;padding:40px 20px}

/* ========== ONBOARDING (neutral) ==========
   Onboarding runs before a theme is picked, so it overrides the themed tokens
   with the neutral baseline. Everything inside .onb resolves against these. */
/* onboarding always runs in the Neutral primitive mode — it predates the
   theme choice, so it must not inherit whatever the party ends up using */
.onb{flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-body)}
.onb-scroll{flex:1;overflow-y:auto;padding:70px 28px 20px;display:flex;flex-direction:column}
/* the theme step carries the most content — tighten it so all three cards fit unscrolled */
.onb-scroll.tight{padding-top:46px}
.onb-scroll.tight .onb-party{margin-bottom:24px}
.onb-scroll.tight .onb-field{margin-bottom:18px}
.onb-scroll.tight .onb-theme{margin-bottom:10px}
.onb-scroll.tight .onb-theme .tf{padding:8px}
.onb-scroll::-webkit-scrollbar{width:0}
.onb-scroll>*{flex-shrink:0}
/* the CTA swoops up from below once the step's required fields are satisfied.
   It keeps its layout space while hidden so nothing reflows when it arrives. */
.onb-foot{flex-shrink:0;padding:14px 28px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;
  transform:translateY(130%);opacity:0;pointer-events:none;
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .26s ease}
.onb-foot.up{transform:none;opacity:1;pointer-events:auto}
.onb-logo{display:block;width:200px;max-width:60%;margin:0 auto}
.onb-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

.onb-cta{width:100%;min-height:52px;border-radius:10px;background:var(--accent);color:var(--ink-on-accent);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s}
.onb-cta.off{background:var(--surface-disabled);color:#A5A099;cursor:default}
.onb-cta .ar{font-size:17px;line-height:1}
.onb-skip{text-align:center;font-size:14px;color:var(--ink-secondary);padding:8px;cursor:pointer}

.onb-field{margin-bottom:24px}
.onb-label{font-size:15px;font-weight:500;margin-bottom:8px;line-height:1.4}
.onb-label .opt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-secondary);font-weight:600;margin-left:6px}
/* fields are tap-to-fill in the demo: a tap drops in sample data */
.onb-input{width:100%;min-height:48px;border:1px solid var(--border-subtle);border-radius:8px;background:var(--surface-card);padding:0 16px;display:flex;align-items:center;font-size:15px;color:var(--ink-secondary);margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.onb-input:last-child{margin-bottom:0}
.onb-input.filled{color:var(--ink-primary);border-color:#CFCAC2}
.onb-photo{width:96px;height:96px;border-radius:50%;background:#F5EFD8;display:flex;align-items:center;justify-content:center;margin:4px auto 0;cursor:pointer;overflow:hidden}
.onb-photo svg{display:block;width:40px;height:40px;color:#b0a06a}
.onb-photo img{width:100%;height:100%;object-fit:cover;display:block}

.onb-welcome{font-size:30px;font-weight:700;text-align:center;line-height:1.2;margin-bottom:24px}
.onb-party{width:100%;text-align:center;margin-bottom:32px}
.onb-party .nm{font-size:40px;font-weight:700;line-height:1.1}
.onb-party .dt{font-size:22px;font-weight:600;margin-top:6px}

/* invite landing (arrived via a role link) */
.onb-inv-pre{font-size:22px;font-weight:500}
.onb-inv-hey{font-size:28px;font-weight:700;margin-top:30px}
/* the invitation line stays on one line; the party name always gets its own */
.onb-inv-body{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:18px;color:var(--ink-secondary);line-height:1.5;margin-top:12px}
.onb-inv-body .v{white-space:nowrap}
.onb-inv-party{font-weight:700;color:var(--ink-primary);border-bottom:2px solid var(--accent);padding-bottom:1px}

/* role questions, revealed as they become relevant */
.onb-q{margin-bottom:24px}
.onb-q.reveal{animation:onbIn .3s ease both}
@keyframes onbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.onb-q-label{font-size:15px;line-height:1.4;margin-bottom:10px}
.onb-pills{display:flex;gap:12px}
.onb-pill{min-width:56px;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--ink-primary);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;line-height:1;background:transparent;color:var(--ink-primary);cursor:pointer;transition:all .15s}
.onb-pill.on{background:var(--accent);color:var(--ink-on-accent);border-color:var(--accent)}

/* date picker */
.onb-dp{width:100%;border:1px solid var(--border-subtle);border-radius:12px;background:var(--surface-card);padding:16px;box-shadow:0 4px 16px rgba(60,40,60,.06)}
.onb-dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.onb-dp-arrow{width:36px;height:36px;border:1px solid var(--border-subtle);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.onb-dp-arrow svg{display:block;width:18px;height:18px;color:var(--ink-primary)}
.onb-dp-month{font-weight:600;font-size:16px}
.onb-dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.onb-dp-dow{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-secondary);font-weight:500}
.onb-dp-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-primary);cursor:pointer;transition:background .12s}
.onb-dp-cell:not(.dim):not(.sel):not(.range):hover{background:#EFECE7;border-radius:50%}
.onb-dp-cell.dim{color:#C5BFB6;cursor:default}
.onb-dp-cell.sel{background:var(--accent);color:var(--ink-on-accent);border-radius:50%;font-weight:600}
.onb-dp-cell.range{background:#DAD5CD}
.onb-dp-cell.range.rs{border-radius:50% 0 0 50%}
.onb-dp-cell.range.re{border-radius:0 50% 50% 0}

/* theme cards — each previews itself in its own type + colour */
.onb-theme{width:100%;border:1px solid var(--border-subtle);border-radius:12px;overflow:hidden;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.onb-theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.onb-theme .tb{padding:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.onb-theme .tl{display:flex;flex-direction:column;gap:4px}
.onb-theme .tr{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.onb-theme .tt{font-size:20px;font-weight:600}
.onb-theme .ts,.onb-theme .tc{font-size:13px}
.onb-theme .tbtn{height:38px;padding:0 16px;border-radius:8px;display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.onb-theme .sws{display:flex;gap:9px}
.onb-theme .sw{width:26px;height:26px;border-radius:50%}
.onb-theme .tf{border-top:1px solid var(--border-subtle);text-align:center;padding:10px;font-size:14px;font-weight:500;background:var(--surface-card)}
.th-dw .tb{background:#F5EDE2}.th-dw .tt{font-family:'Cormorant Garamond',serif;color:#2E2822}
.th-dw .ts,.th-dw .tc{font-family:'DM Sans',sans-serif;color:#7A6F63}.th-dw .tbtn{background:#C4714B;color:#FFFEFB}
.th-iv .tb{background:#FBF9F5}.th-iv .tt{font-family:'EB Garamond',serif;color:#3A3630}
.th-iv .ts,.th-iv .tc{font-family:'Jost',sans-serif;color:#756B60}.th-iv .tbtn{background:#C7A96B;color:#3A3630}
.th-pp .tb{background:#FDF3F8}.th-pp .tt{font-family:'Fredoka',sans-serif;color:#2B2733;font-weight:400}
.th-pp .ts,.th-pp .tc{font-family:'Poppins','DM Sans',sans-serif;color:#8A7F93}.th-pp .tbtn{background:#F5617A;color:#FFFEFB}

/* seed activities */
.onb-lead{font-size:22px;font-weight:600;line-height:1.35;margin-bottom:8px}
.onb-sub{font-size:14px;color:var(--ink-secondary);line-height:1.45;margin-bottom:22px}
.onb-add{width:100%;min-height:52px;border:1px solid var(--accent);border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:600;color:var(--accent);cursor:pointer}
.onb-add .pl{font-size:19px;line-height:1}
.onb-add.spent{border-color:var(--border-subtle);color:var(--ink-secondary);cursor:default}
.onb-days{display:flex;gap:10px;margin:24px 0 16px}
.onb-day{width:52px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--accent-quiet);color:var(--ink-primary);cursor:pointer;transition:all .15s}
.onb-day.on{background:var(--accent);color:var(--ink-on-accent)}
.onb-day .n{font-size:18px;font-weight:600;line-height:1}
.onb-day .l{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.onb-ev{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:10px;padding:14px 16px;margin-bottom:10px;animation:onbIn .3s ease both}
.onb-ev .t{font-size:15px;font-weight:600}
.onb-ev .m{font-size:13px;color:var(--ink-secondary);margin-top:3px}
.onb-none{font-size:14px;color:var(--ink-secondary);text-align:center;padding:22px 0}

/* invite links */
.onb-linkrow{margin-bottom:20px}
.onb-linkrow .k{font-size:14px;font-weight:500;margin-bottom:8px}
.onb-linkbox{display:flex;align-items:center;gap:10px;border:1px solid var(--border-subtle);border-radius:8px;background:var(--surface-card);padding:0 6px 0 14px;min-height:48px}
.onb-linkbox .u{flex:1;min-width:0;font-size:13px;color:var(--ink-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onb-copy{flex-shrink:0;height:36px;padding:0 14px;border-radius:6px;background:var(--accent-quiet);color:var(--ink-primary);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;cursor:pointer;transition:all .15s}
.onb-copy.done{background:var(--accent);color:var(--ink-on-accent)}
.onb-note{font-size:12px;color:var(--ink-secondary);line-height:1.5;margin-top:2px}
</style>
</head>

const HPX=132,MPX=HPX/60;
function resolveEv(ev,role){if(ev.vis==="everyone")return{render:true,mode:"default"};if(ev.vis==="secret")return role==="bride"?{render:false}:{render:true,mode:"secret"};if(ev.vis==="teased")return role==="bride"?{render:true,mode:"teased"}:{render:true,mode:"half"};return{render:true,mode:"default"};}

// Before the trip the header counts down; once it's underway the countdown is
// replaced by whatever happens next. The two states share one slot.
// Picking the day you're actually on drops you at the current time; picking any
// other day is a fresh browse, so it starts at the top.
function scrollTimeline(){
  const sc=document.querySelector(".timeline-scroll");if(!sc)return;
  if(tripNow&&currentDay===tripNow.day&&document.querySelector(".hour-row")){
    sc.scrollTop=Math.max(0,(tripNow.min-gridBase)*MPX-40);
  }else{sc.scrollTop=0;}
}
// an activity is "past" once its end time has gone by on the simulated clock
function isPast(e){return !!tripNow&&(e.day<tripNow.day||(e.day===tripNow.day&&e.end<=tripNow.min));}
function nextUp(role){
  if(!tripNow)return null;
  const later=EVENTS.map((e,i)=>({ev:e,i,res:resolveEv(e,role)}))
    .filter(x=>x.res.render&&(x.ev.day>tripNow.day||(x.ev.day===tripNow.day&&x.ev.start>=tripNow.min)))
    .sort((a,b)=>a.ev.day-b.ev.day||a.ev.start-b.ev.start);
  return later[0]||null;
}
function comingUpCard(role){
  const up=nextUp(role);
  if(!up)return`<div class="coming-up quiet"><span class="cu-label">That's a wrap:</span><div class="cu-body"><span class="cu-name">Nothing left on the schedule</span></div></div>`;
  const {ev:e,i,res}=up,sameDay=e.day===tripNow.day,dayPart=sameDay?"":DAYS.find(d=>d.n===e.day).label+" · ";
  if(res.mode==="teased")return`<div class="coming-up" data-i="${i}"><span class="cu-label">Coming up:</span><div class="cu-body"><span class="cu-name">Something's planned for you…</span><span class="cu-meta num">${dayPart}${fmtTime(e.start)} · just show up!</span></div></div>`;
  const lock=(res.mode==="secret"||res.mode==="half")?`<span class="cu-lock">${svg("lock")}</span>`:"";
  return`<div class="coming-up" data-i="${i}"><span class="cu-label">Coming up:</span><div class="cu-body"><span class="cu-name">${e.name}${lock}</span><span class="cu-meta num">${dayPart}${fmtTime(e.start)} · at ${e.loc}</span></div></div>`;
}
// Before the trip the header carries the countdown, and the add button tucks under it
// on the day selector's inset. Once the trip starts the countdown gives way to the
// "coming up" card down below, and the button follows it there, flush and one gap tighter.
function renderHome(){
  const isPlanner=currentRole==="planner";
  const addBtn=isPlanner?`<div class="btn btn-line btn-full btn-add-activity" id="addActBtn"><span class="ic">${svg("plus")}</span><span class="btn-label">Add activity</span></div>`:"";
  const headExtra=tripNow?"":`<div class="countdown"><span class="word">in</span><span class="days num">23</span><span class="word">days</span></div>`+(addBtn?`<div class="add-row">${addBtn}</div>`:"");
  const actions=tripNow?`<div class="home-actions">${comingUpCard(currentRole)}${addBtn}</div>`:"";
  return`<div class="top-fixed home-top"><div class="header"><div class="header-title-wrap"><div class="header-title">Get pumped for Nidhi's Bach</div><div class="header-loc">in Scottsdale, AZ</div></div>${headExtra}</div>${actions}<div class="date-selector" id="daySelector"></div></div><div class="timeline-scroll"><div class="timegrid" id="timegrid"></div></div>`;
}
function bindHome(){
  document.querySelector(".coming-up[data-i]")?.addEventListener("click",e=>{openAct=+e.currentTarget.dataset.i;currentView="home-view";render();});
  document.getElementById("addActBtn")?.addEventListener("click",()=>{currentView="home-add";splitOpen=false;hideOn=false;actVis="everyone";bridePaysCk=true;render();});
  const ds=document.getElementById("daySelector");
  ds.innerHTML=DAYS.map(d=>`<div class="day-chip ${d.n===currentDay?"on":""}" data-day="${d.n}"><span class="dnum num">${d.n}</span><span class="dlbl">${d.label}</span></div>`).join("");
  ds.querySelectorAll(".day-chip").forEach(c=>c.addEventListener("click",()=>{currentDay=+c.dataset.day;bindHome();scrollTimeline();}));
  const role=currentRole,dayEvts=EVENTS.map((e,i)=>({ev:e,i,res:resolveEv(e,role)})).filter(x=>x.ev.day===currentDay&&x.res.render);
  const grid=document.getElementById("timegrid");
  if(!dayEvts.length){gridBase=0;grid.style.height="200px";grid.innerHTML='<div class="empty-msg">Nothing planned yet for this day.</div>';return;}
  const fs=Math.min(...dayEvts.map(x=>x.ev.start)),le=Math.max(...dayEvts.map(x=>x.ev.end));
  const sh=Math.floor(fs/60),eh=Math.ceil(le/60),base=sh*60;gridBase=base;
  let hh="";for(let i=sh;i<=eh;i++){const top=(i*60-base)*MPX;hh+=`<div class="hour-row" style="top:${top}px"><span class="hour-tick">${fmtHour(i)}</span><div class="hour-line"></div></div>`;}
  let ev="";dayEvts.forEach(({ev:e,i,res})=>{const top=(e.start-base)*MPX,ht=(e.end-e.start)*MPX;
    const pastF=isPast(e);
    if(res.mode==="teased"&&!pastF){ev+=`<div class="ac teased" data-i="${i}" style="top:${top}px;height:${ht}px"><div class="inner"><div class="aname">Something's planned for you\u2026</div><div class="ameta">${fmtTime(e.start)} \u00b7 just show up!</div></div></div>`;}
    else{const cls=pastF?"past":(res.mode==="secret"?"secret":res.mode==="half"?"half":"");const bdg=(!pastF&&(res.mode==="secret"||res.mode==="half"))?`<div class="secret-badge">${svg("lock")}</div>`:"";
      ev+=`<div class="ac ${cls}" data-i="${i}" style="top:${top}px;height:${ht}px"><div class="inner"><div class="aname">${e.name}</div><div class="ameta num">${fmtTime(e.start)}\u2013${fmtTime(e.end)} \u00b7 at ${e.loc}</div></div>${bdg}</div>`;}});
  grid.style.height=((eh-sh)*HPX+24)+"px";grid.innerHTML=hh+'<div class="events-layer">'+ev+'</div>';
  grid.querySelectorAll(".ac").forEach(c=>c.addEventListener("click",()=>{openAct=+c.dataset.i;currentView="home-view";render();}));
}

const EXPENSES=[
  {id:"airbnb",name:"Airbnb",date:"01/15/26",total:217015,payer:"selena",split:ALL,secret:false,status:"confirmed"},
  {id:"hibachi",name:"Hibachi chef",date:"02/19/26",total:120015,payer:"shalini",split:ALL,secret:false,status:"confirmed"},
  {id:"yoga",name:"Yoga class",date:"03/15/26",total:35015,payer:"martha",split:ALL,secret:false,status:"confirmed"},
  {id:"brunch",name:"Brunch Sunday",date:"01/20/26",total:20550,payer:"priya",split:ALL,secret:false,status:"confirmed"},
  {id:"fire",name:"Surprise fire show",date:"02/19/26",total:25000,payer:"shalini",split:NOBRIDE,secret:true,status:"confirmed"},
  {id:"spa",name:"Spa surprise",date:"03/15/26",total:35000,payer:"priya",split:NOBRIDE,secret:true,status:"pending",sub:"priya"},
  {id:"decor",name:"Balloons & decor",date:"03/02/26",total:9600,payer:"martha",split:ALL,secret:false,status:"pending",sub:"martha"}
];
function expVisible(exp,role){if(exp.secret&&role==="bride")return false;if(exp.status==="pending"){if(role==="planner")return true;return exp.sub===VIEWER[role];}return true;}
function sharesOf(exp){const n=exp.split.length,b=Math.floor(exp.total/n),r=exp.total-b*n,o={};exp.split.forEach(m=>o[m]=b);o[exp.split.includes(exp.payer)?exp.payer:exp.split[0]]+=r;return o;}
function balances(role){const bal={};ALL.forEach(m=>bal[m]=0);EXPENSES.filter(e=>e.status==="confirmed"&&expVisible(e,role)).forEach(e=>{bal[e.payer]+=e.total;const sh=sharesOf(e);Object.keys(sh).forEach(m=>bal[m]-=sh[m]);});return bal;}
function settlements(role){const bal=balances(role),d=[],c=[];ALL.forEach(m=>{if(bal[m]<0)d.push([m,-bal[m]]);else if(bal[m]>0)c.push([m,bal[m]]);});d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;while(i<d.length&&j<c.length){const a=Math.min(d[i][1],c[j][1]);if(a)out.push({from:d[i][0],to:c[j][0],amount:a});d[i][1]-=a;c[j][1]-=a;if(!d[i][1])i++;if(!c[j][1])j++;}return out;}

function renderExpenses(){
  const role=currentRole,me=VIEWER[role],bal=balances(role),net=bal[me];
  const visible=EXPENSES.filter(e=>expVisible(e,role)),confirmed=visible.filter(e=>e.status==="confirmed"),pending=visible.filter(e=>e.status==="pending");
  const label=net<0?"You owe":net>0?"You're owed":"You're settled up",amount=net===0?"":(`<div class="owe-amount num">${money(Math.abs(net))}</div>`);
  // Nobody settles until the tab is closed, because the amount owed can still move.
  // Closing it out is the planner's call, and once it's done the tab takes no new
  // expenses — so the add button goes with it and settling becomes the only action.
  // Settling is an action for the people who have to send money, so it only shows to
  // someone in the red — being owed means waiting on everyone else, not doing anything.
  const cta=tabClosed?(net<0?`<div class="btn btn-primary" id="settleBtn"><span class="btn-label">Settle up</span></div>`:"")
    :role==="planner"?`<div class="btn btn-line" id="closeOutBtn"><span class="btn-label">Close out</span></div>`:"";
  const addBtn=tabClosed?"":`<div class="btn btn-primary btn-sm" id="addExpBtn"><span class="ic">${svg("plus")}</span><span class="btn-label">Add</span></div>`;
  const pendingBlock=pending.length?`<div class="sect-label">${role==="planner"?"Pending approval":"Your pending"}</div>`+pending.map(e=>expCard(e,role)).join(""):"";
  return`<div class="top-fixed"><div class="head-row"><div class="page-title">Expenses</div>${addBtn}</div>
    <div class="total-card"><div class="total-left"><div class="owe-label">${label}</div>${amount}</div>${cta}</div></div>
    <div class="exp-scroll"><div class="exp-list">${pendingBlock}${pending.length?'<div class="sect-label">Confirmed</div>':""}${confirmed.map(e=>expCard(e,role)).join("")}</div></div>`;
}
function expCard(e,role){const me=VIEWER[role],sh=sharesOf(e),mine=sh[me]||0,pending=e.status==="pending";
  const bdg=(e.secret&&role!=="bride")?`<div class="badge secret">${svg("lock")}</div>`:"";
  let sub="";if(pending)sub=role==="planner"?`<div class="exp-sub">Pending \u00b7 submitted by ${MEMBERS[e.sub].name}</div>`:`<div class="exp-sub">Pending approval</div>`;
  return`<div class="exp-card ${pending?"pending":""}" data-exp="${e.id}"><div class="exp-inner"><div class="exp-row"><span class="exp-name">${e.name}</span><span class="exp-amount num">${money(mine)}</span></div><div class="exp-row"><span class="exp-date num">${e.date}</span><span class="exp-total">Total cost:\u00a0<span class="num">${money(e.total)}</span></span></div>${sub}</div>${bdg}</div>`;}
function bindExpenses(){
  document.getElementById("settleBtn")?.addEventListener("click",()=>{currentView="expenses-settle";render();});
  document.getElementById("closeOutBtn")?.addEventListener("click",()=>{currentView="expenses-close";render();});

function renderSettle(){
  const role=currentRole,me=VIEWER[role],bal=balances(role),net=bal[me],mine=settlements(role).filter(t=>t.from===me||t.to===me);
  let headline,rows;
  if(net<0){headline=`<div class="owe-line">You owe <span class="amt num">${money(-net)}</span></div>`;

  else if(net>0){headline=`<div class="owe-line">You're owed <span class="amt num">${money(net)}</span></div>`;
    rows=mine.filter(t=>t.to===me).map(t=>`<div class="send-to">Collect <span class="amt num">${money(t.amount)}</span> from</div><div class="pay-card"><img class="pc-av" src="${AVATARS[t.from]}" alt=""><div><div class="pc-name">${MEMBERS[t.from].name}</div><div class="pc-handle"><span class="lbl">Venmo</span> ${MEMBERS[t.from].venmo}</div><div class="pc-handle num"><span class="lbl">Zelle</span> ${MEMBERS[t.from].zelle}</div></div></div>`).join("");}
  else{headline=`<div class="owe-line">You're all settled up.</div>`;rows="";}
  return`<div class="settle-head"><span class="back-ic" id="backBtn">${svg("back")}</span><span class="head-title">Settle your tab</span></div>
    <div class="settle-body"><div class="closed-note">${svg("check")} <div class="closed-note-text">The tab is closed out. This amount is final.</div></div>${headline}${rows}<div class="done-btn" id="doneBtn">Done</div></div>`;
}

function canSeeBoard(b,role){if(b.id==="announcements")return true;return b.members.includes(VIEWER[role]);}
function visSrcBoards(role){return BOARDS.filter(b=>b.id!=="announcements"&&canSeeBoard(b,role)).map(b=>b.id);}
function lastPrev(b,role){if(b.id==="announcements"){const srcs=visSrcBoards(role),anns=[];for(const bid of Object.keys(MSGS)){if(role==="bride"&&!srcs.includes(bid))continue;MSGS[bid].filter(m=>m.ann).forEach(m=>anns.push(m));}return anns.length?anns[anns.length-1]:null;}return(MSGS[b.id]||[]).slice(-1)[0]||null;}

function renderMessages(){
  const role=currentRole,boards=BOARDS.filter(b=>canSeeBoard(b,role)),canAdd=role==="planner";
  let h=`<div class="top-fixed"><div class="head-row"><div class="page-title">Messages</div>${canAdd?`<div class="btn btn-line btn-sm" id="addBoardBtn"><span class="ic">${svg("plus")}</span><span class="btn-label">Add</span></div>`:""}</div></div><div class="list-scroll"><div class="board-list">`;
  boards.forEach(b=>{const last=lastPrev(b,role);const prev=last?`<div class="board-prev"><span class="prev-sender">${MEMBERS[last.from].name}:</span><span class="prev-text">${last.text}</span></div>`:`<div class="board-prev"><span class="prev-text" style="color:var(--ink-secondary)">No messages yet</span></div>`;
    let bdg="";if(b.type==="announce")bdg=`<div class="badge pin">${svg("pin")}</div>`;else if(b.noBride)bdg=`<div class="badge secret">${svg("lock")}</div>`;
    h+=`<div class="board ${b.type} ${b.read?"read":""}" data-bid="${b.id}"><div class="board-inner"><div class="board-name">${b.name}</div>${prev}</div>${bdg}</div>`;});
  return h+`</div></div>`;
}

// Everyone starts off the list and you start on it, so a group is secret by
// default — it only loses the lock and the dashed border once the bride is added.
let newGroupName="",newGroupMembers=[],newGroupN=0;
function renderAddGroup(){
  const me=VIEWER[currentRole];
  const rows=ALL.filter(id=>id!==me).map(id=>{const on=newGroupMembers.includes(id);
    return`<div class="split-row"><div class="split-left"><div class="checkbox ${on?"on":"off"} gcb" data-m="${id}">${on?svgC("check"):""}</div><span class="field-label">${MEMBERS[id].name}</span></div></div>`;}).join("")
    +`<div class="split-row"><div class="split-left"><div class="checkbox on locked">${svgC("check")}</div><span class="field-label">You</span></div></div>`;
  return`<div class="form-head"><span class="back-ic" id="backBtn">${svg("back")}</span><span class="form-title">New message group</span></div>
<div class="form-scroll">
  <input class="input" id="groupName" type="text" placeholder="Group name" value="${newGroupName.replace(/"/g,"&quot;")}">
  <div class="group"><div class="section-label">Who's in it?</div>${rows}</div>
  <div class="btn-save ${newGroupName.trim()?"":"off"}" id="createGroupBtn"><span class="btn-label">Create group</span></div>
</div>`;
}
function bindAddGroup(){
  document.getElementById("backBtn").addEventListener("click",()=>{currentView="messages";render();});
  const nameEl=document.getElementById("groupName");
  // typed live, so re-rendering the whole view on each keystroke would eat the caret
  nameEl.addEventListener("input",()=>{newGroupName=nameEl.value;document.getElementById("createGroupBtn").classList.toggle("off",!newGroupName.trim());});
  document.querySelectorAll(".gcb").forEach(cb=>cb.addEventListener("click",()=>{
    const id=cb.dataset.m,i=newGroupMembers.indexOf(id);
    if(i<0)newGroupMembers.push(id);else newGroupMembers.splice(i,1);
    render();}));
  document.getElementById("createGroupBtn").addEventListener("click",()=>{
    const name=newGroupName.trim();if(!name)return;
    const members=[...newGroupMembers,VIEWER[currentRole]],noBride=!members.includes("nidhi");
    const id="group-"+(++newGroupN);
    BOARDS.push({id,name,type:noBride?"nobride":"plusbride",members,noBride,read:false});
    MSGS[id]=[];
    newGroupName="";newGroupMembers=[];currentView="messages";render();});
}

function renderThread(boardId){
  const role=currentRole,me=VIEWER[role],board=BOARDS.find(b=>b.id===boardId),isAnn=boardId==="announcements",canCompose=!isAnn,canAnnounce=role==="planner"&&canCompose;
  let titleHTML;if(isAnn)titleHTML=`<div class="thread-title">Announcements</div>`;
  else{const tag=board.noBride?` <span class="nobride-tag">(NO BRIDE)</span>`:"";titleHTML=`<div class="thread-title">${board.name.replace("+ THE BRIDE","").trim()}${tag}</div><div class="thread-sub num">${board.members.length} members</div>`;}
  let h=`<div class="thread-head"><span class="back-ic" id="backBtn">${svg("back")}</span><div>${titleHTML}</div></div><div class="thread"><div class="divider">Today</div>`;
  const renderMsg=(m,secret,isSelf)=>{const side=isSelf?"right":"left";const sn=isSelf?"":(`<div class="sender">${MEMBERS[m.from].name}</div>`);
    if(m.ann){const cls=secret?"ann-secret":(isSelf?"ann-self":"ann-other");const sb=secret?`<div class="secret-badge">${svg("lock")}</div>`:"";
      return`<div class="row ${side}"><div class="avatar"><img src="${AVATARS[m.from]}" alt=""></div><div class="mc ${cls}">${sb}${m.source?`<div class="ann-source">from ${m.source}</div>`:""}<div class="ann-label">Announcement</div>${sn}<div class="body-text">${m.text}</div><div class="time num">${m.time}</div></div></div>`;}
    const cls=isSelf?"self":"other";return`<div class="row ${side}"><div class="avatar"><img src="${AVATARS[m.from]}" alt=""></div><div class="mc ${cls}">${sn}<div class="body-text">${m.text}</div><div class="time num">${m.time}</div></div></div>`;};
  if(isAnn){const srcs=visSrcBoards(role);for(const[bid,msgs]of Object.entries(MSGS)){const sb=BOARDS.find(b=>b.id===bid);if(role==="bride"&&!srcs.includes(bid))continue;msgs.filter(m=>m.ann).forEach(m=>{const secret=sb.noBride&&role!=="bride";h+=renderMsg({...m,source:sb.name},secret,m.from===me);});}
  }else{(MSGS[boardId]||[]).forEach(m=>{h+=renderMsg(m,board.noBride,m.from===me);});}
  h+=`</div>`;
  if(canCompose){let tog="";if(canAnnounce){const defaultOn=board.noBride;const secretSpan=board.noBride?` \u00b7 <span class="secret-note">secret from the bride</span>`:"";
    tog=`<div class="compose-toggle" id="annToggle" data-on="${defaultOn}"><div class="cbox ${defaultOn?"on":"off"}" id="annCbox">${defaultOn?svgC("check"):""}</div><span><span class="ct-b">Post as announcement</span>${secretSpan}</span></div>`;}
    h+=`<div class="composer">${tog}<div class="compose-row"><div class="cinput">Message...</div><div class="send">${svg("send")}</div></div></div>`;}
  return h;
}

const ONB_FRESH=["splash","phone","profile","name","dates","roles","details","seed","links"];
const ONB_JOIN=["invite","phone","profile"];
const PARTY={name:"Nidhi's Bach",dates:"December 18-21, 2026",loc:"Scottsdale, AZ"};
let onb=null;

function onbSteps(){return onb.entry==="fresh"?ONB_FRESH:ONB_JOIN;}
function onbStep(){return onbSteps()[onb.i];}
function startOnb(entry){
  onb={entry,i:0,q1:null,q2:null,q3:null,q4:null,theme:null,day:18,seeded:{},copied:{},
       filled:{},ds:null,de:null,footUp:false};
  currentView="onb";render();
}
function onbNext(){onb.footUp=false;if(onb.i<onbSteps().length-1){onb.i++;render();}else onbFinish();}

/* what each step needs before its CTA is allowed to appear */
function onbReady(){
  switch(onbStep()){
    case"splash":return false;
    case"phone":return !!onb.filled.phone;
    case"profile":return !!onb.filled.name;
    case"name":return !!onb.filled.event;
    case"dates":return !!(onb.ds&&onb.de);
    case"roles":return onbRolesDone();
    case"details":return !!onb.filled.loc&&!!onb.theme;
    default:return true;
  }
}
function onbFinish(){
  // the link you arrived with decides your role; a creator who is the bride lands as the bride
  currentRole=onb.entry==="fresh"?(onb.q2==="yes"?"bride":"planner"):onb.entry;
  if(onb.theme)currentTheme=onb.theme;   // the creator's pick becomes the party's theme
  onb=null;currentView="home";currentDay=18;render();
}

/* which role questions are live, given the answers so far */
function onbShowQ3(){return onb.q1==="no"&&onb.q2==="no";}   // is the bride one of the other planners?
function onbShowQ4(){return onb.q1==="no"&&onb.q2==="yes";}  // only meaningful if someone else could keep a secret
function onbRolesDone(){
  if(!onb.q1||!onb.q2)return false;
  if(onbShowQ3()&&!onb.q3)return false;
  if(onbShowQ4()&&!onb.q4)return false;
  return true;
}
function onbSetQ(k,v){
  onb[k]=v;
  if(!onbShowQ3())onb.q3=null;
  if(!onbShowQ4())onb.q4=null;
  render();
}
/* a link per permission level, and only the ones this setup actually needs */
function onbLinks(){
  const out=[];
  if(onb.q1==="no")out.push({id:"plan",k:"Link for other planners",u:"veil.app/j/nb-plan-7Q4X",
    note:onb.q3==="yes"?"The bride has her own link below — send this one to your other planners.":null});
  if(onb.q2==="no")out.push({id:"bride",k:"Link for THE BRIDE",u:"veil.app/j/nb-bride-K2M9",
    note:onb.q3==="yes"?"Carries planning access. She can add and edit — but hidden items stay hidden from her.":"Read-only, and hidden items stay hidden from her."});
  out.push({id:"guest",k:"Link for everyone else",u:"veil.app/j/nb-guest-B8T1",note:null});
  return out;
}

const ONB_CAM='<svg viewBox="0 0 24 24" fill="none"><path d="M2 8.4C2 7.5 2.6 6.5 3.7 6.4C4.2 6.3 4.9 6.2 5.4 5C5.7 4.2 6.5 4 7 4H17C17.5 4 18.3 4.2 18.6 5C19.1 6.2 19.8 6.3 20.3 6.4C21.4 6.5 22 7.5 22 8.4V17C22 18.7 21 19 20 19H4C3 19 2 18.7 2 17V8.4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="4" stroke="currentColor" stroke-width="2"/></svg>';
function onbShell(body,foot,cls){return`<div class="onb theme-neutral"><div class="onb-scroll${cls?" "+cls:""}">${body}</div>${foot?`<div class="onb-foot">${foot}</div>`:""}</div>`;}
function onbCta(label){return`<div class="onb-cta" id="onbCta"><span>${label}</span><span class="ar">→</span></div>`;}
/* tap-to-fill: the demo has no keyboard, so a tap drops in the sample value */
function onbField(id,placeholder,sample){
  const v=onb.filled[id];
  return`<div class="onb-input${v?" filled":""}" data-fill="${id}" data-sample="${sample.replace(/"/g,"&quot;")}">${v||placeholder}</div>`;
}
function onbLogo(w,style){return`<img class="onb-logo" src="${VEIL_LOGO}" alt="Veil" style="width:${w}px${style?";"+style:""}">`;}
function onbParty(){return`<div class="onb-party"><div class="nm">${PARTY.name}</div><div class="dt num">${PARTY.dates}</div></div>`;}
function onbQ(key,label,opts){
  return`<div class="onb-q reveal"><div class="onb-q-label">${label}</div><div class="onb-pills" data-q="${key}">${
    opts.map(o=>`<div class="onb-pill ${onb[key]===o.v?"on":""}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`;
}

/* December 2026 starts on a Tuesday, so the grid leads with Nov 29-30 and
   trails into Jan 1-2. Tap a day to set the start, tap a later day to close
   the range; tapping again starts over. */
function onbDateTap(d){
  if(!onb.ds||onb.de||d<=onb.ds){onb.ds=d;onb.de=null;}
  else onb.de=d;
  render();
}
function onbDatepicker(){
  const s=onb.ds,e=onb.de;
  const cells=[{d:29,dim:1},{d:30,dim:1}];
  for(let i=1;i<=31;i++)cells.push({d:i});
  cells.push({d:1,dim:1},{d:2,dim:1});
  const cls=c=>{
    if(c.dim)return"dim";
    if(c.d===s||c.d===e)return"sel";
    if(s&&e&&c.d>s&&c.d<e)return"range"+(c.d===s+1?" rs":"")+(c.d===e-1?" re":"");
    return"";
  };
  const arrow=d=>`<div class="onb-dp-arrow"><svg viewBox="0 0 24 24" fill="none"><path d="${d==="l"?"M15 18L9 12L15 6":"M9 6L15 12L9 18"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
  return`<div class="onb-dp"><div class="onb-dp-head">${arrow("l")}<div class="onb-dp-month">December 2026</div>${arrow("r")}</div>
    <div class="onb-dp-grid" id="onbDp">${["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=>`<div class="onb-dp-dow">${d}</div>`).join("")}
    ${cells.map(c=>`<div class="onb-dp-cell ${cls(c)} num"${c.dim?"":` data-d="${c.d}"`}>${c.d}</div>`).join("")}</div></div>`;
}
