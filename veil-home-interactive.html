<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veil — Home (interactive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-page: #F5EDE2; --surface-card: #FFFBF5; --surface-disabled: #E7E1D8;
    --ink-primary: #2E2822; --ink-secondary: #7A6F63;
    --accent: #C4714B; --accent-quiet: #E8D5C4; --ink-on-accent: #FFFEFB;
    --visibility-everyone: #7B9370; --visibility-teased: #D9A566; --visibility-hidden: #8C3A3F;
    --border-subtle: #EBDFCF;
    --radius-card: 12px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
    --font-display: 'Cormorant Garamond', serif; --font-body: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #dcd8de; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 30px 20px 60px; font-family: var(--font-body); }
  .num { font-feature-settings: "lnum" 1, "tnum" 1; }

  .role-toggle { display: flex; gap: 6px; background: #fff; padding: 6px; border-radius: 12px; box-shadow: 0 4px 16px rgba(60,40,60,0.15); }
  .role-toggle button { border: none; background: transparent; font-family: var(--font-body); font-weight: 600; font-size: 13px; padding: 9px 18px; border-radius: 8px; color: #8a7f78; cursor: pointer; transition: all .15s; }
  .role-toggle button.on { background: var(--accent); color: #fff; }
  .role-caption { font-size: 12px; color: #6b6470; text-align: center; max-width: 393px; line-height: 1.45; min-height: 34px; }

  .screen { width: 393px; height: 852px; background: var(--surface-page); border-radius: 34px; box-shadow: 0 16px 50px rgba(60,40,60,.18); position: relative; overflow: hidden; color: var(--ink-primary); display: flex; flex-direction: column; }
  .top-fixed { flex-shrink: 0; padding: 70px var(--space-5) 0; display: flex; flex-direction: column; gap: var(--space-5); }
  .header { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
  .header-title-wrap { width: 100%; border-bottom: 1px solid var(--border-subtle); padding: var(--space-2) 0; }
  .header-title { font-family: var(--font-display); font-weight: 600; font-size: 44px; line-height: 48px; letter-spacing: -.5px; }
  .countdown { display: flex; align-items: center; justify-content: center; gap: var(--space-1); font-family: var(--font-display); font-weight: 600; }
  .countdown .word { font-size: 22px; color: var(--ink-secondary); }
  .countdown .days { font-size: 44px; letter-spacing: -.5px; color: var(--accent); }

  .date-selector { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-2); }
  .day-chip { width: 60px; height: 60px; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--accent-quiet); color: var(--ink-primary); cursor: pointer; }
  .day-chip.on { background: var(--accent); color: var(--ink-on-accent); }
  .day-chip .dnum { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 28px; }
  .day-chip .dlbl { font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: .6px; text-transform: uppercase; margin-top: 1px; }

  .timeline-scroll { flex: 1; overflow-y: auto; padding: var(--space-4) var(--space-5) 130px; margin-top: var(--space-4); }
  .timeline-scroll::-webkit-scrollbar { width: 0; }
  .timegrid { position: relative; width: 100%; }
  .hour-row { position: absolute; left: 0; width: 100%; height: 0; }
  .hour-tick { position: absolute; left: 0; top: -8px; width: 34px; text-align: right; font-weight: 600; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-secondary); }
  .hour-line { position: absolute; left: 42px; right: 0; top: 0; border-top: 1px solid var(--border-subtle); }
  .events-layer { position: absolute; left: 42px; right: 0; top: 0; bottom: 0; }

  /* activityCard variants pulled from Figma */
  .ac { position: absolute; left: 6px; right: 0; background: var(--surface-card); border-left: 2px solid var(--visibility-everyone); border-right: 2px solid var(--visibility-everyone); border-radius: var(--radius-card); padding: 0 var(--space-3); overflow: hidden; }
  .ac .inner { height: 100%; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); padding: 8px 0; display: flex; flex-direction: column; }
  .ac .aname { font-weight: 400; font-size: 16px; line-height: 24px; color: var(--ink-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac .ameta { font-weight: 400; font-size: 13px; line-height: 18px; letter-spacing: .1px; color: var(--ink-secondary); margin-top: 2px; }

  /* default = everyone (green). already the base. */

  /* half secret = planner/guest view of a teased event: amber sides, details, badge */
  .ac.half { border-left-color: var(--visibility-teased); border-right-color: var(--visibility-teased); }

  /* teased = bride view: amber sides, tinted, no details */
  .ac.teased { border-left-color: var(--visibility-teased); border-right-color: var(--visibility-teased); background: color-mix(in srgb, var(--visibility-teased) 10%, var(--surface-card)); }
  .ac.teased .inner { border: none; justify-content: center; }
  .ac.teased .aname { color: var(--visibility-teased); }

  /* secret = planner/guest view of hidden event: dashed red, badge */
  .ac.secret { border: 1px dashed var(--visibility-hidden); }
  .ac.secret .inner { border: none; }

  /* past = already happened: terracotta border, disabled fill */
  .ac.past { border-left-color: var(--accent); border-right-color: var(--accent); background: var(--surface-disabled); }

  .badge { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 10px; background: var(--visibility-hidden); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .badge svg { width: 12px; height: 12px; color: var(--ink-on-accent); }

  .nav { position: absolute; left: 0; bottom: 0; width: 100%; height: 80px; background: var(--surface-card); display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-4) var(--space-6); border-top: 1px solid var(--border-subtle); }
  .nav-item { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink-secondary); }
  .nav-item.on { color: var(--accent); }
  .nav-ico svg { display: block; width: 24px; height: 24px; }
  .nlbl { font-weight: 600; font-size: 12px; line-height: 16px; letter-spacing: .6px; text-transform: uppercase; }
</style>
</head>

  const DAYS = [
    { n:18, label:"Fri" }, { n:19, label:"Sat" }, { n:20, label:"Sun" }, { n:21, label:"Mon" }
  ];

  // vis: everyone | teased | secret
  const EVENTS = [
    // Fri 18 - arrival + first-night surprises
    { day:18, start:15*60,    end:15*60+30, name:"Arrive & settle in",  loc:"the Airbnb",  vis:"everyone" },
    { day:18, start:16*60,    end:17*60+30, name:"Drinks & pictures",   loc:"the Airbnb",  vis:"everyone" },
    { day:18, start:17*60+30, end:19*60,    name:"Hibachi dinner",      loc:"Kona Grill",  vis:"everyone" },
    { day:18, start:20*60,    end:20*60+45, name:"Surprise fire show",  loc:"the Airbnb",  vis:"secret" },
    { day:18, start:21*60+15, end:22*60+30, name:"Late-night dessert bar", loc:"the Airbnb", vis:"teased" },

    // Sat 19 - spa day + secret dinner
    { day:19, start:9*60,     end:10*60,    name:"Group breakfast",     loc:"the Airbnb",  vis:"everyone" },
    { day:19, start:11*60,    end:13*60,    name:"Spa & massages",      loc:"Sanctuary Spa", vis:"teased" },
    { day:19, start:14*60,    end:16*60,    name:"Pool & drinks",       loc:"the Airbnb",  vis:"everyone" },
    { day:19, start:19*60,    end:21*60+30, name:"Secret rooftop dinner", loc:"downtown",  vis:"secret" },

    // Sun 20 - activities, one teased
    { day:20, start:10*60,    end:11*60+30, name:"Hot yoga class",      loc:"CorePower",   vis:"everyone" },
    { day:20, start:12*60,    end:13*60+30, name:"Brunch",              loc:"Hash Kitchen",vis:"everyone" },
    { day:20, start:15*60,    end:17*60,    name:"Mystery afternoon",   loc:"TBD",         vis:"teased" },
    { day:20, start:20*60,    end:22*60,    name:"Bar crawl",           loc:"Old Town",    vis:"everyone" },

    // Mon 21 - send-off
    { day:21, start:10*60,    end:11*60,    name:"Farewell brunch",     loc:"the Airbnb",  vis:"everyone" },
    { day:21, start:11*60+30, end:12*60,    name:"Pack & checkout",     loc:"the Airbnb",  vis:"everyone" }
  ];

  const ROLE_COPY = {
    planner: "PLANNER: full read/write. Secret events show dashed with a lock. Teased events show real details with a lock badge (half-secret) so you know not to spoil them.",
    bride:   "BRIDE: secret events vanish entirely (no gap). Teased events become an amber mystery card holding the time slot, details hidden.",
    guest:   "GUEST: in on the surprises. Sees secret and teased events with full details plus the lock badge, so guests know not to leak them to the bride."
  };

  let currentRole = "planner";
  let currentDay = 18;
  const HOUR_PX = 132, MIN_PX = HOUR_PX/60;

  // resolve one event for a role
  function resolveEvent(ev, role) {
    if (ev.vis === "everyone") return { render:true, mode:"default" };
    if (ev.vis === "secret")
      return role === "bride" ? { render:false } : { render:true, mode:"secret" };
    if (ev.vis === "teased")
      return role === "bride" ? { render:true, mode:"teased" } : { render:true, mode:"half" };
    return { render:true, mode:"default" };
  }

  function fmtTime(m){ let h=Math.floor(m/60),mm=m%60,ap=h>=12?"PM":"AM",hh=h%12; if(hh===0)hh=12; return hh+":"+String(mm).padStart(2,"0")+" "+ap; }
  function fmtHour(h){ let ap=h>=12?"PM":"AM",hh=h%12; if(hh===0)hh=12; return hh+" "+ap; }

  const BADGE = '<div class="badge"><svg viewBox="0 0 24 24" fill="none"><path d="M17 11V8C17 5.23858 14.7614 3 12 3C9.23858 3 7 5.23858 7 8V11M8.8 21H15.2C16.8802 21 17.7202 21 18.362 20.673C18.9265 20.3854 19.3854 19.9265 19.673 19.362C20 18.7202 20 17.8802 20 16.2V15.8C20 14.1198 20 13.2798 19.673 12.638C19.3854 12.0735 18.9265 11.6146 18.362 11.327C17.7202 11 16.8802 11 15.2 11H8.8C7.11984 11 6.27976 11 5.63803 11.327C5.07354 11.6146 4.6146 12.0735 4.32698 12.638C4 13.2798 4 14.1198 4 15.8V16.2C4 17.8802 4 18.7202 4.32698 19.362C4.6146 19.9265 5.07354 20.3854 5.63803 20.673C6.27976 21 7.11984 21 8.8 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';

  function renderDaySelector(){
    const el = document.getElementById("daySelector");
    el.innerHTML = DAYS.map(d => `<div class="day-chip ${d.n===currentDay?'on':''}" data-day="${d.n}"><span class="dnum num">${d.n}</span><span class="dlbl">${d.label}</span></div>`).join("");
    el.querySelectorAll(".day-chip").forEach(c => c.addEventListener("click", () => { currentDay=+c.dataset.day; render(); }));
  }

  function render(){
    document.querySelectorAll(".role-toggle button").forEach(b => b.classList.toggle("on", b.dataset.role===currentRole));
    document.getElementById("roleCaption").textContent = ROLE_COPY[currentRole];
    renderDaySelector();

    const dayEvents = EVENTS.filter(e=>e.day===currentDay)
      .map(e=>({ev:e,res:resolveEvent(e,currentRole)}))
      .filter(x=>x.res.render);

    const grid = document.getElementById("timegrid");
    if (dayEvents.length===0){ grid.style.height="200px"; grid.innerHTML='<div style="text-align:center;color:var(--ink-secondary);padding-top:40px;font-size:15px;">Nothing planned yet for this day.</div>'; return; }

    const firstStart = Math.min(...dayEvents.map(x=>x.ev.start));
    const lastEnd = Math.max(...dayEvents.map(x=>x.ev.end));
    const startHour = Math.floor(firstStart/60), endHour = Math.ceil(lastEnd/60), base = startHour*60;

    let hoursHTML="";
    for(let h=startHour;h<=endHour;h++){ const top=(h*60-base)*MIN_PX; hoursHTML+=`<div class="hour-row" style="top:${top}px"><span class="hour-tick">${fmtHour(h)}</span><div class="hour-line"></div></div>`; }

    let eventsHTML="";
    dayEvents.forEach(({ev,res})=>{
      const top=(ev.start-base)*MIN_PX, height=(ev.end-ev.start)*MIN_PX;
      if(res.mode==="teased"){
        eventsHTML += `<div class="ac teased" style="top:${top}px;height:${height}px"><div class="inner"><div class="aname">Something&#39;s planned for you&#8230;</div><div class="ameta">${fmtTime(ev.start)} &#183; just show up!</div></div></div>`;
      } else {
        const cls = res.mode==="secret" ? "secret" : res.mode==="half" ? "half" : "";
        const badge = (res.mode==="secret"||res.mode==="half") ? BADGE : "";
        eventsHTML += `<div class="ac ${cls}" style="top:${top}px;height:${height}px"><div class="inner"><div class="aname">${ev.name}</div><div class="ameta num">${fmtTime(ev.start)}&#8211;${fmtTime(ev.end)} &#183; at ${ev.loc}</div></div>${badge}</div>`;
      }
    });

    grid.style.height = ((endHour-startHour)*HOUR_PX+24)+"px";
    grid.innerHTML = hoursHTML + '<div class="events-layer">'+eventsHTML+'</div>';
  }

  document.querySelectorAll(".role-toggle button").forEach(b => b.addEventListener("click", ()=>{ currentRole=b.dataset.role; render(); }));
  render();
</script>
</body>
</html>
